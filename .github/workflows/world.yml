# Ultimate Transport Tycoon: builds every route in the world for the game, from OpenStreetMap.
# Actions tab -> "Build world data" -> Run workflow. It starts with Great Britain; type "all" for the whole world.
# Map data (c) OpenStreetMap contributors, ODbL.
name: Build world data

on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Which regions (like great-britain or france, comma separated), or "all" for the whole world'
        default: 'great-britain'
        required: true
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: world-data
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        env:
          REGIONS: ${{ github.event.inputs.regions || 'built' }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, urllib.request
          want = os.environ['REGIONS'].strip().lower()
          req = urllib.request.Request('https://download.geofabrik.de/index-v1-nogeom.json',
                                       headers={'User-Agent': 'utt-world-builder (GitHub Actions)'})
          props = [f['properties'] for f in json.load(urllib.request.urlopen(req, timeout=180))['features']]
          byid = {p['id']: p for p in props}
          top = {p['id'] for p in props if not p.get('parent')}
          # (combined extracts that would only repeat others)
          skip = {'dach', 'alps', 'britain-and-ireland', 'united-kingdom', 'us-midwest', 'us-northeast',
                  'us-pacific', 'us-south', 'us-west'}
          if want in ('all', 'world'):
              ids = [p['id'] for p in props if p.get('parent') in top and p['id'] not in skip]
          elif want == 'built':
              out = subprocess.run(['git', 'ls-remote', '--heads', 'https://github.com/' + os.environ['REPO']],
                                   capture_output=True, text=True).stdout
              ids = [ln.split('refs/heads/data-')[1] for ln in out.splitlines() if 'refs/heads/data-' in ln]
          else:
              ids = [w.strip() for w in want.split(',') if w.strip()]
          inc, seen = [], set()
          for i in ids:
              p = byid.get(i)
              if not p or i in seen or 'pbf' not in p.get('urls', {}):
                  print('not a region I know:', i)
                  continue
              seen.add(i)
              inc.append({'region': i, 'name': p.get('name', i), 'url': p['urls']['pbf']})
          if len(inc) > 256:
              print('more than 256 regions: building the first 256, run it again for the rest')
              inc = inc[:256]
          print(len(inc), 'regions:', ', '.join(x['region'] for x in inc))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'include': inc}) + '\n')
              f.write('count=' + str(len(inc)) + '\n')
          EOF

  region:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      REGION: ${{ matrix.region }}
      REGION_NAME: ${{ matrix.name }}
      REGION_URL: ${{ matrix.url }}
    steps:
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "osmium>=4.0" "shapely>=2.1" pyshp numpy scipy
      - name: Download the map
        run: |
          curl -sSfL --retry 3 -A "utt-world-builder (GitHub Actions)" -o region.osm.pbf "$REGION_URL"
          # (the edge of the extract: the sea is only worked out inside it)
          curl -sSfL --retry 3 -A "utt-world-builder (GitHub Actions)" -o region.poly "${REGION_URL%-latest.osm.pbf}.poly" || rm -f region.poly
          ls -la region.osm.pbf region.poly || true
      - name: Build the routes
        run: |
          cat > world_build.py <<'PYEOF'
          #!/usr/bin/env python3
          """Ultimate Transport Tycoon - world data builder.

          Reads one OpenStreetMap extract (.osm.pbf) and writes the files the game loads for that region:
            meta.json            what's in the region (tiles, counts)
            places.json          the places you complete (council areas), with outlines
            towns.json           towns you can start in
            t/<x>/<y>.json       detail tiles (zoom 12): stops, the routes calling at them, water, parks, roads
            o/<x>/<y>.json       overview tiles (zoom 8): sea, lakes, forests, motorways
            r/<nn>/<id>.json     one file per route: its stops in order and the shape between them
          Map data (c) OpenStreetMap contributors, ODbL. The sea comes from the coastline in the same data.
          """
          import argparse
          import json
          import math
          import os
          import re
          import time
          from array import array
          from collections import Counter, defaultdict

          import numpy as np
          import osmium
          import shapely
          import shapely.ops
          from shapely.geometry import LineString, Polygon, box
          from shapely.strtree import STRtree

          T0 = time.time()


          def log(*a):
              print(f'[{time.time() - T0:7.1f}s]', *a, flush=True)


          TZ, OZ, EXT = 12, 8, 4096
          ROUTE_MODES = {'bus': 'bus', 'trolleybus': 'bus', 'coach': 'bus', 'minibus': 'bus', 'tram': 'tram', 'funicular': 'tram',
                         'light_rail': 'metro', 'subway': 'metro', 'monorail': 'metro', 'train': 'train', 'ferry': 'ferry'}
          MODE_BIT = {'bus': 1, 'tram': 2, 'metro': 4, 'train': 8, 'ferry': 16}
          STATION_BIT = 32
          SKIP_WORDS = ('rail replacement', 'replacement bus', 'disused', 'test route', 'proposed', 'planned')
          PALETTE = ['#FF4D4D', '#FF8A00', '#FFC400', '#3DCB4A', '#00BFA5', '#1EA7FF', '#4D6BFF', '#9B5CFF', '#FF4FC1', '#E0457B',
                     '#14B8C8', '#FF6F3C', '#7AC70C', '#00A0E0', '#C86BFA', '#F2545B']
          CSS = {'red': '#E32017', 'blue': '#0019A8', 'green': '#00782A', 'yellow': '#FFD300', 'orange': '#EE7C0E', 'purple': '#9B0056',
                 'pink': '#F3A9BB', 'brown': '#B36305', 'black': '#333333', 'grey': '#A0A5A9', 'gray': '#A0A5A9', 'white': '#DDDDDD',
                 'cyan': '#00A4A7', 'magenta': '#E5007E', 'navy': '#003688', 'lime': '#84B817', 'teal': '#00A4A7', 'maroon': '#8B1A1A',
                 'gold': '#D4A017', 'violet': '#8F00FF', 'darkgreen': '#006400', 'darkblue': '#00008B', 'lightblue': '#6CB4EE',
                 'darkred': '#8B0000', 'olive': '#808000', 'silver': '#C0C0C0', 'turquoise': '#40E0D0'}

          # ---------------------------------------------------------------- helpers
          def mercx(lon):
              return (lon + 180.0) / 360.0


          def mercy(lat):
              lat = max(-85.05, min(85.05, lat))
              s = math.sin(math.radians(lat))
              return 0.5 - math.log((1 + s) / (1 - s)) / (4 * math.pi)


          def tile_of(lon, lat, z):
              n = 1 << z
              return int(mercx(lon) * n), int(mercy(lat) * n)


          def tile_lonlat_box(x, y, z):
              n = 1 << z
              lon0 = x / n * 360.0 - 180.0
              lon1 = (x + 1) / n * 360.0 - 180.0
              lat0 = math.degrees(math.atan(math.sinh(math.pi * (1 - 2 * (y + 1) / n))))
              lat1 = math.degrees(math.atan(math.sinh(math.pi * (1 - 2 * y / n))))
              return lon0, lat0, lon1, lat1


          def to_tile_px(geom, x, y, z):
              """lon/lat geometry -> that tile's local coordinates (0..EXT)"""
              n = 1 << z

              def f(c):
                  lon, lat = c[:, 0], np.clip(c[:, 1], -85.05, 85.05)
                  s = np.sin(np.radians(lat))
                  my = 0.5 - np.log((1 + s) / (1 - s)) / (4 * math.pi)
                  mx = (lon + 180.0) / 360.0
                  return np.column_stack([(mx * n - x) * EXT, (my * n - y) * EXT])
              return shapely.transform(geom, f)


          def hav_km(a, b):
              (lo1, la1), (lo2, la2) = a, b
              p1, p2 = math.radians(la1), math.radians(la2)
              dp, dl = p2 - p1, math.radians(lo2 - lo1)
              h = math.sin(dp / 2) ** 2 + math.cos(p1) * math.cos(p2) * math.sin(dl / 2) ** 2
              return 2 * 6371.0 * math.asin(min(1.0, math.sqrt(h)))


          def e5(v):
              return int(round(v * 1e5))


          def clean_name(n):
              n = (n or '').strip()
              for _ in range(2):
                  n = re.sub(r'\s*[-(]?\s*(?:alighting|set down|setting down|drop off|arrivals?)( only)?\)?\s*$', '', n, flags=re.I)
                  n = re.sub(r'\s*\((?:stop|stand|bay|platform|stance|gate)?\s*[A-Za-z]{0,2}\d{0,3}[A-Za-z]?\)\s*$', '', n, flags=re.I)
                  n = re.sub(r'\s*[,-]?\s*(?:stop|stand|bay|platform|stance|gate)\s*[\w-]{1,3}$', '', n, flags=re.I)
              n = re.sub(r'\s*/\s*$', '', n).strip(' -,/')
              # (a stop code on the end of a normal name: Lime Street TE -> Lime Street)
              m = re.match(r'^(.*[a-z].*\S)\s+([A-Z]{1,2}\d?)$', n)
              if m and m.group(2) not in ('ST', 'RD', 'N', 'S', 'E', 'W', 'NE', 'NW', 'SE', 'SW', 'UK'):
                  n = m.group(1)
              # (names typed in capitals: Liverpool Road, not LIVERPOOL ROAD)
              letters = [c for c in n if c.isalpha()]
              if len(letters) > 3 and sum(c.isupper() for c in letters) / len(letters) > 0.8:
                  # (and the stop's code on the end: JAMES ST JE -> James St)
                  m = re.match(r'^(.*\S)\s+([A-Z]{1,2}\d?)$', n)
                  if m and m.group(2) not in ('ST', 'RD', 'DR', 'LN', 'SQ', 'PL', 'CT', 'CL', 'GR', 'PK', 'AV', 'WY', 'HL', 'NE', 'NW', 'SE', 'SW', 'N', 'S', 'E', 'W'):
                      n = m.group(1)
                  n = re.sub(r"\b([A-Za-z])([A-Za-z']*)", lambda m: m.group(1).upper() + m.group(2).lower(), n)
                  n = re.sub(r"'S\b", "'s", n)
              return n


          def name_key(n):
              n = clean_name(n).lower()
              n = re.sub(r'^(opp|opposite|adj|adjacent|o/s|outside|nr|near|o/p|before|after)\.?\s+', '', n)
              n = re.sub(r'\b(railway station|train station|station|bus station|tram stop|stop)\b', ' ', n)
              return re.sub(r'[^a-z0-9]+', '', n)


          def colour_of(*vals):
              for v in vals:
                  v = (v or '').strip().lower().replace(' ', '')
                  if not v:
                      continue
                  if re.fullmatch(r'#?[0-9a-f]{6}', v):
                      return '#' + v.lstrip('#').upper()
                  if re.fullmatch(r'#?[0-9a-f]{3}', v):
                      h = v.lstrip('#')
                      return '#' + ''.join(c * 2 for c in h).upper()
                  if v in CSS:
                      return CSS[v]
              return None


          def pick_colour(key):
              h = 0
              for ch in key:
                  h = (h * 131 + ord(ch)) & 0xFFFFFFFF
              return PALETTE[h % len(PALETTE)]


          def enc_deltas(pts):
              """[(x, y), ...] ints -> [x0, y0, dx1, dy1, ...]"""
              out, px, py = [], 0, 0
              for x, y in pts:
                  out.append(x - px); out.append(y - py)
                  px, py = x, y
              return out


          def pkey(p):
              """a point of the map (lon, lat) as a key: the data has them to 7 places"""
              return (round(p[0] * 1e7), round(p[1] * 1e7))


          class UF:
              def __init__(self):
                  self.p = {}

              def find(self, a):
                  p = self.p
                  p.setdefault(a, a)
                  while p[a] != a:
                      p[a] = p[p[a]]
                      a = p[a]
                  return a

              def union(self, a, b):
                  ra, rb = self.find(a), self.find(b)
                  if ra != rb:
                      self.p[max(ra, rb)] = min(ra, rb)


          # ---------------------------------------------------------------- step 1: keep only what the game needs
          FILTER_PAIRS = [
              ('type', 'route'), ('type', 'route_master'), ('public_transport', 'stop_area'), ('boundary', 'administrative'),
              ('public_transport', 'stop_position'), ('public_transport', 'platform'), ('public_transport', 'station'),
              ('highway', 'bus_stop'), ('railway', 'station'), ('railway', 'halt'), ('railway', 'tram_stop'), ('railway', 'stop'),
              ('railway', 'platform'), ('amenity', 'ferry_terminal'), ('amenity', 'bus_station'),
              ('place', 'city'), ('place', 'town'), ('place', 'village'),
              ('natural', 'water'), ('waterway', 'riverbank'), ('waterway', 'river'), ('waterway', 'canal'), ('waterway', 'dock'),
              ('landuse', 'reservoir'), ('landuse', 'basin'),
              ('leisure', 'park'), ('leisure', 'garden'), ('leisure', 'nature_reserve'), ('leisure', 'golf_course'),
              ('leisure', 'common'), ('leisure', 'recreation_ground'), ('landuse', 'forest'), ('landuse', 'recreation_ground'),
              ('landuse', 'cemetery'), ('landuse', 'village_green'), ('natural', 'wood'),
              ('natural', 'heath'), ('natural', 'beach'), ('natural', 'sand'),
              ('highway', 'motorway'), ('highway', 'trunk'), ('highway', 'primary'), ('highway', 'secondary'),
              # (the smaller roads too: to join the gaps in bus routes along them)
              ('highway', 'tertiary'), ('highway', 'unclassified'), ('highway', 'residential'), ('highway', 'road'),
              ('highway', 'living_street'), ('highway', 'service'), ('highway', 'busway'), ('highway', 'bus_guideway'),
              ('highway', 'motorway_link'), ('highway', 'trunk_link'), ('highway', 'primary_link'), ('highway', 'secondary_link'),
              ('highway', 'tertiary_link'),
              ('railway', 'rail'), ('railway', 'light_rail'), ('railway', 'subway'), ('railway', 'tram'),
              ('aeroway', 'aerodrome'), ('natural', 'coastline'),
          ] + [('tourism', v) for v in ('attraction', 'museum', 'zoo', 'theme_park', 'gallery', 'aquarium')] + \
              [('historic', 'castle'), ('leisure', 'stadium'), ('building', 'cathedral')]
          SIGHT_PAIRS = {('tourism', 'attraction'): 'sight', ('tourism', 'museum'): 'museum', ('tourism', 'zoo'): 'zoo',
                         ('tourism', 'theme_park'): 'park', ('tourism', 'gallery'): 'museum', ('tourism', 'aquarium'): 'zoo',
                         ('historic', 'castle'): 'castle', ('leisure', 'stadium'): 'stadium',
                         ('building', 'cathedral'): 'church'}


          def sight_kind(t):
              if not t.get('name') or not t.get('wikidata'):
                  return None
              for (k, v), kind in SIGHT_PAIRS.items():
                  if t.get(k) == v:
                      return kind
              return None
          PLACE_NODE = {'city', 'town', 'village'}


          def keep_filtered(o):
              t = o.tags
              if o.is_relation():
                  ty = t.get('type')
                  if ty == 'route':
                      return t.get('route') in ROUTE_MODES
                  if ty == 'route_master':
                      return t.get('route_master') in ROUTE_MODES
                  if t.get('public_transport') == 'stop_area':
                      return True
                  if t.get('boundary') == 'administrative':
                      try:
                          return 4 <= int(t.get('admin_level', '99')) <= 8
                      except ValueError:
                          return False
                  return ty == 'multipolygon'
              if o.is_node():
                  if t.get('place') in PLACE_NODE or is_stopish(t) or sight_kind(t) or (t.get('aeroway') == 'aerodrome' and t.get('iata')):
                      return True
                  return False
              # ways: everything matched (roads, rail, water, green, platforms)
              return t.get('place') is None and t.get('boundary') is None


          def filter_pbf(src, dst):
              n = 0
              with osmium.BackReferenceWriter(dst, ref_src=src, overwrite=True) as w:
                  for o in osmium.FileProcessor(src).with_filter(osmium.filter.TagFilter(*FILTER_PAIRS)):
                      if keep_filtered(o):
                          w.add(o)
                          n += 1
              log('filtered', n, 'objects ->', dst, os.path.getsize(dst) // 1024, 'KB')


          # ---------------------------------------------------------------- step 2: read it
          WATER = {('natural', 'water'), ('waterway', 'riverbank'), ('waterway', 'dock'), ('landuse', 'reservoir'), ('landuse', 'basin')}
          GREEN = {('leisure', 'park'), ('leisure', 'garden'), ('leisure', 'nature_reserve'), ('leisure', 'golf_course'),
                   ('leisure', 'common'), ('leisure', 'recreation_ground'), ('landuse', 'forest'), ('landuse', 'recreation_ground'),
                   ('landuse', 'cemetery'), ('landuse', 'village_green'), ('natural', 'wood'), ('natural', 'heath')}
          SAND = {('natural', 'beach'), ('natural', 'sand')}
          # (1 motorways and trunk roads, 2 A roads, 3 B roads, 4 smaller roads, 5 streets)
          ROUTE_ONLY_ROADS = {'service', 'pedestrian', 'bus_guideway', 'track'}
          ROAD_CLASS = {'motorway': 1, 'motorway_link': 1, 'trunk': 1, 'trunk_link': 1, 'primary': 2, 'primary_link': 2,
                        'secondary': 3, 'secondary_link': 3, 'tertiary': 4, 'tertiary_link': 4, 'unclassified': 4, 'busway': 4,
                        'residential': 5, 'living_street': 5, 'road': 5}
          RAIL_CLASS = {'rail': 6, 'light_rail': 6, 'subway': 6, 'tram': 7}
          RIVER_CLASS = {'river': 8, 'canal': 8}


          def area_kind(t):
              for k, v in t:
                  if (k, v) in WATER:
                      return 'w'
              for k, v in t:
                  if (k, v) in SAND:
                      return 's'
              for k, v in t:
                  if (k, v) in GREEN:
                      return 'g'
              return None


          class Reader:
              def __init__(self):
                  self.routes = {}          # relation id -> dict
                  self.masters = {}         # route relation id -> master tags
                  self.stop_areas = []      # (id, name, [('n', id) / ('w', id)])
                  self.need_ways = set()    # route member ways (geometry) and platform ways
                  self.need_nodes = set()   # nodes routes and stop areas list
                  self.nodes = {}           # stop-ish node id -> (lon, lat, tags dict)
                  self.way_geom = {}        # way id -> np.array (n, 2) lon/lat
                  self.way_tags = {}        # platform ways -> tags
                  self.towns = []           # (name, lon, lat, place, population)
                  self.areas = {'w': [], 'g': [], 's': []}
                  self.lines = []           # (class, shapely LineString lon/lat)
                  self.admin = []           # (id, name, level, population, polygon)
                  self.sights = []          # (name, lon, lat, kind)
                  self.coast = []           # coastline ways (land on their left), np arrays lon/lat
                  self.airports = []        # (iata, name, lon, lat)
                  self.rounds = []          # roundabouts: (first point, last point, x0, y0, x1, y1, its points if a route uses it)

              def relations(self, path):
                  for r in osmium.FileProcessor(path, osmium.osm.RELATION):
                      t = dict(r.tags)
                      ty = t.get('type')
                      mem = [(m.type, m.ref, m.role) for m in r.members]
                      if ty == 'route' and t.get('route') in ROUTE_MODES:
                          self.routes[r.id] = {'id': r.id, 'tags': t, 'members': mem}
                          for typ, ref, role in mem:
                              if typ == 'w':
                                  self.need_ways.add(ref)
                              elif typ == 'n':
                                  self.need_nodes.add(ref)
                      elif ty == 'route_master':
                          for typ, ref, role in mem:
                              if typ == 'r':
                                  self.masters[ref] = (r.id, t)
                      elif t.get('public_transport') == 'stop_area':
                          self.stop_areas.append((r.id, t.get('name', ''), [(typ, ref) for typ, ref, role in mem if typ in ('n', 'w')]))
                          for typ, ref, role in mem:
                              if typ == 'w':
                                  self.need_ways.add(ref)
                              elif typ == 'n':
                                  self.need_nodes.add(ref)
                  log('routes', len(self.routes), 'masters', len(set(m[0] for m in self.masters.values())), 'stop areas', len(self.stop_areas))

              def everything(self, path):
                  wkb = osmium.geom.WKBFactory()
                  area_filter = osmium.filter.TagFilter(*(list(WATER) + list(GREEN) + list(SAND) + [('boundary', 'administrative'), ('aeroway', 'aerodrome')] +
                                                          list(SIGHT_PAIRS)))
                  fp = osmium.FileProcessor(path).with_locations().with_areas(area_filter)
                  for o in fp:
                      if o.is_node():
                          t = o.tags
                          if not o.location.valid():
                              continue
                          pl = t.get('place')
                          if pl in PLACE_NODE:
                              if t.get('name'):
                                  pop = t.get('population', '')
                                  pop = int(re.sub(r'[^0-9]', '', pop) or 0) if len(pop) < 12 else 0
                                  self.towns.append((t.get('name'), o.location.lon, o.location.lat, pl, pop))
                              continue
                          sk = sight_kind(t)
                          if sk:
                              self.sights.append((t.get('name:en') or t.get('name'), o.location.lon, o.location.lat, sk))
                          if t.get('aeroway') == 'aerodrome' and t.get('iata'):
                              self.airports.append((t.get('iata'), t.get('name:en') or t.get('name') or t.get('iata'), o.location.lon, o.location.lat))
                          if o.id in self.need_nodes or is_stopish(t):
                              self.nodes[o.id] = (o.location.lon, o.location.lat, dict(t))
                      elif o.is_way():
                          t = o.tags
                          hw, rw, ww = t.get('highway'), t.get('railway'), t.get('waterway')
                          if t.get('natural') == 'coastline':
                              try:
                                  c = shapely.get_coordinates(shapely.from_wkb(wkb.create_linestring(o)))
                                  if len(c) >= 2:
                                      self.coast.append(c)
                              except Exception:
                                  pass
                          if hw and t.get('junction') in ('roundabout', 'circular'):
                              try:
                                  c = [(n.location.lon, n.location.lat) for n in o.nodes]
                              except osmium.InvalidLocationError:
                                  c = None
                              if c and len(c) >= 2:
                                  lons, lats = [q[0] for q in c], [q[1] for q in c]
                                  self.rounds.append((pkey(c[0]), pkey(c[-1]), min(lons), min(lats), max(lons), max(lats),
                                                      [pkey(q) for q in c] if o.id in self.need_ways else None))
                          cls = ROAD_CLASS.get(hw) or RAIL_CLASS.get(rw) or RIVER_CLASS.get(ww)
                          # (a road a bus route uses that isn't a kind that's drawn, like a bus station's way
                          # in or a high street just for buses and people: drawn as a street, so no bus
                          # route runs where there's no road on the map)
                          if not cls and hw in ROUTE_ONLY_ROADS and o.id in self.need_ways and t.get('area') != 'yes' and \
                                  t.get('public_transport') != 'platform':
                              cls = 5
                          if o.id in self.need_ways or cls:
                              try:
                                  g = shapely.from_wkb(wkb.create_linestring(o))
                              except Exception:
                                  continue
                              if o.id in self.need_ways:
                                  self.way_geom[o.id] = shapely.get_coordinates(g)
                                  if t.get('public_transport') == 'platform' or t.get('highway') == 'bus_stop' or t.get('railway') == 'platform':
                                      self.way_tags[o.id] = dict(t)
                              if cls and t.get('tunnel') not in ('yes', 'building_passage') and t.get('layer', '0') not in ('-1', '-2', '-3'):
                                  if not (cls in (6, 7) and t.get('service')):
                                      self.lines.append((cls, g))
                      elif o.is_area():
                          t = o.tags
                          if t.get('boundary') == 'administrative' and not o.from_way():
                              try:
                                  lvl = int(t.get('admin_level', '99'))
                              except ValueError:
                                  continue
                              if 4 <= lvl <= 8 and t.get('name'):
                                  try:
                                      g = shapely.from_wkb(wkb.create_multipolygon(o))
                                  except Exception:
                                      continue
                                  pop = t.get('population', '')
                                  pop = int(re.sub(r'[^0-9]', '', pop) or 0) if len(pop) < 12 else 0
                                  self.admin.append((o.orig_id(), t.get('name:en') or t.get('name'), lvl, pop, g))
                              continue
                          sk = sight_kind(t)
                          apt = t.get('aeroway') == 'aerodrome' and t.get('iata')
                          if sk or apt:
                              try:
                                  c = shapely.from_wkb(wkb.create_multipolygon(o)).representative_point()
                                  if sk:
                                      self.sights.append((t.get('name:en') or t.get('name'), c.x, c.y, sk))
                                  if apt:
                                      self.airports.append((t.get('iata'), t.get('name:en') or t.get('name') or t.get('iata'), c.x, c.y))
                              except Exception:
                                  pass
                              if not area_kind(list(t)):
                                  continue
                          k = area_kind(list(t))
                          if not k:
                              continue
                          try:
                              g = shapely.from_wkb(wkb.create_multipolygon(o))
                          except Exception:
                              continue
                          # (skip the tiny ones: about 0.3 ha at 50 degrees north)
                          b = g.bounds
                          if (b[2] - b[0]) * (b[3] - b[1]) < 3e-8:
                              continue
                          self.areas[k].append(g)
                  log('nodes', len(self.nodes), 'route ways', len(self.way_geom), 'towns', len(self.towns),
                      'water', len(self.areas['w']), 'green', len(self.areas['g']), 'lines', len(self.lines), 'admin', len(self.admin),
                      'sights', len(self.sights), 'airports', len(self.airports), 'coastline ways', len(self.coast))


          # ---------------------------------------------------------------- step 3: stops
          def is_stopish(t):
              return (t.get('public_transport') in ('stop_position', 'platform', 'station') or t.get('highway') == 'bus_stop' or
                      t.get('railway') in ('station', 'halt', 'tram_stop', 'stop', 'platform') or t.get('amenity') in ('ferry_terminal', 'bus_station'))


          def is_station(t):
              return t.get('public_transport') == 'station' or t.get('railway') in ('station', 'halt') or \
                  t.get('amenity') in ('bus_station', 'ferry_terminal')


          def build_stops(R):
              """every stop-ish thing -> one game stop (both sides of the road, the platforms of a station...)"""
              el = {}   # key -> (lon, lat, name, tags)
              for nid, (lon, lat, t) in R.nodes.items():
                  if is_stopish(t):
                      el[('n', nid)] = (lon, lat, t.get('name', ''), t)
              for wid, t in R.way_tags.items():
                  c = R.way_geom.get(wid)
                  if c is not None and len(c):
                      el[('w', wid)] = (float(c[:, 0].mean()), float(c[:, 1].mean()), t.get('name', ''), t)
              uf = UF()
              for k in el:
                  uf.find(k)
              # stop areas group a station's (or a stop's) bits
              sa_name = {}
              for sid, nm, mem in R.stop_areas:
                  keys = [m for m in mem if m in el]
                  for k in keys[1:]:
                      uf.union(keys[0], k)
                  for k in keys:
                      if nm:
                          sa_name[k] = nm
              # same name, close by: one stop (bus 70 m, rail/tram/ferry 350 m)
              cell = 0.0035
              grid = defaultdict(list)
              for k, (lon, lat, nm, t) in el.items():
                  grid[(int(lon / cell), int(lat / cell))].append(k)
              for k, (lon, lat, nm, t) in el.items():
                  key = name_key(sa_name.get(k) or nm)
                  railish = t.get('railway') in ('station', 'halt', 'platform', 'stop') or t.get('train') == 'yes' or \
                      t.get('subway') == 'yes' or t.get('light_rail') == 'yes' or t.get('public_transport') == 'station' or \
                      t.get('amenity') == 'ferry_terminal' or t.get('tram') == 'yes' or t.get('railway') == 'tram_stop'
                  low = clean_name(sa_name.get(k) or nm).lower()
                  big = any(w in low for w in ('bus station', 'interchange', 'bus hub', 'coach station', 'bus terminal'))
                  lim = 0.35 if railish else 0.25 if big else 0.12
                  gx, gy = int(lon / cell), int(lat / cell)
                  reach = 2 if (railish or big) else 1
                  for dx in range(-reach, reach + 1):
                      for dy in range(-reach, reach + 1):
                          for k2 in grid.get((gx + dx, gy + dy), ()):
                              if k2 <= k:
                                  continue
                              lon2, lat2, nm2, t2 = el[k2]
                              key2 = name_key(sa_name.get(k2) or nm2)
                              d = hav_km((lon, lat), (lon2, lat2))
                              if key and key == key2 and d <= lim:
                                  uf.union(k, k2)
                              elif (not key or not key2) and d <= 0.025:
                                  uf.union(k, k2)
              groups = defaultdict(list)
              for k in el:
                  groups[uf.find(k)].append(k)
              stop_of = {}
              stops = {}
              for root, keys in groups.items():
                  def rank(k):
                      t = el[k][3]
                      return (0 if is_station(t) else 1 if t.get('public_transport') == 'platform' or t.get('highway') == 'bus_stop' else 2,
                              0 if el[k][2] else 1, k[1])
                  keys.sort(key=rank)
                  best = keys[0]
                  names = [clean_name(sa_name.get(k) or el[k][2]) for k in keys if (sa_name.get(k) or el[k][2])]
                  t0 = el[best][3]
                  if is_station(t0) and t0.get('name'):
                      name = clean_name(t0['name'])
                  elif names:
                      name = Counter(names).most_common(1)[0][0]
                  else:
                      name = ''
                  if is_station(t0):
                      lon, lat = el[best][0], el[best][1]
                  else:
                      lon = sum(el[k][0] for k in keys) / len(keys)
                      lat = sum(el[k][1] for k in keys) / len(keys)
                  sid = ('n' if best[0] == 'n' else 'w') + str(best[1])
                  stops[sid] = {'id': sid, 'lon': lon, 'lat': lat, 'name': name, 'station': is_station(t0), 'modes': 0, 'routes': []}
                  for k in keys:
                      stop_of[k] = sid
              log('stop elements', len(el), '-> stops', len(stops))
              return stops, stop_of


          # ---------------------------------------------------------------- step 4: routes
          GEOM_ROLES = ('', 'forward', 'backward', 'main', 'hail_and_ride', 'alternative')


          def local_proj(lat0):
              kx, ky = 111.320 * math.cos(math.radians(lat0)), 110.574
              return kx, ky


          def chain_of(R, rel):
              """the route's ways joined end to end into one line (lon, lat), and the jumps in it:
              [k, ...] where chain[k - 1] -> chain[k] is a jump over a gap (no road between them).
              Relations often list their ways out of order, so each next way is the one that joins on
              where the line has got to (the next listed one if several do); only when none does is
              there a gap."""
              ways = []
              for typ, ref, role in rel['members']:
                  if typ == 'w' and role in GEOM_ROLES:
                      c = R.way_geom.get(ref)
                      if c is not None and len(c) >= 2:
                          ways.append([(float(x), float(y)) for x, y in c])
              if not ways:
                  return [], []

              def d2(a, b):
                  return (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2
              TOUCH = 2e-9          # (same node: within about 5 cm)
              NEAR = 0.00035 ** 2   # (a little break in the map data: within about 25-40 m)
              closed = [len(w) > 3 and d2(w[0], w[-1]) < 1e-14 for w in ways]
              n = len(ways)
              # every way end (and every node of a roundabout), on a grid, to find what joins where
              cell = 0.002
              grid = defaultdict(list)
              for i, w in enumerate(ways):
                  pts = w[:-1] if closed[i] else (w[0], w[-1])
                  for p in pts:
                      grid[(int(p[0] / cell), int(p[1] / cell))].append((i, p))

              def joining(at, used, lim):
                  """unused ways with an end (or, for a roundabout, any node) within lim of a point"""
                  gx, gy = int(at[0] / cell), int(at[1] / cell)
                  out = {}
                  for dx in (-1, 0, 1):
                      for dy in (-1, 0, 1):
                          for i, p in grid.get((gx + dx, gy + dy), ()):
                              if not used[i]:
                                  d = d2(at, p)
                                  if d <= lim and (i not in out or d < out[i]):
                                      out[i] = d
                  return out
              def kk(p):
                  return (round(p[0], 7), round(p[1], 7))
              touch = Counter()
              for i, w in enumerate(ways):
                  for p in (w if closed[i] else w[1:-1]):
                      touch[kk(p)] += 2
                  if not closed[i]:
                      touch[kk(w[0])] += 1
                      touch[kk(w[-1])] += 1
              # every end of the route: a way end no other way touches
              ends = []
              for i, w in enumerate(ways):
                  if closed[i]:
                      continue
                  if touch[kk(w[0])] == 1:
                      ends.append((i, False))
                  if touch[kk(w[-1])] == 1:
                      ends.append((i, True))

              def walk(start, flip):
                  used = [False] * n
                  chain, jumps = [], []
                  ring_from = None      # (the line ends going round a roundabout: from this index on)
                  cur = start
                  w = ways[start][::-1] if flip else ways[start]
                  used[start] = True
                  if start != 0 or flip:
                      chain = list(w)
                  elif not closed[0]:
                      a_n = joining(w[0], used, NEAR)
                      b_n = joining(w[-1], used, NEAR)
                      if a_n and not b_n:
                          w = w[::-1]
                      elif a_n and b_n and min(a_n) < min(b_n):
                          w = w[::-1]
                      chain = list(w)
                  else:
                      chain = list(w)
                      ring_from = 0
                  while not all(used):
                      # where the line is now: its end, or anywhere round the roundabout it's on
                      heads = chain[ring_from:] if ring_from is not None else [chain[-1]]
                      best = None
                      for lim in (TOUCH, NEAR):
                          for k, e in enumerate(heads):
                              for i, d in joining(e, used, lim).items():
                                  # (the next listed way first, then the nearest)
                                  key = (0 if i > cur else 1, i if i > cur else -i, d)
                                  if best is None or key < best[0]:
                                      best = (key, i, k)
                          if best:
                              break
                      if best:
                          _, i, k = best
                          if ring_from is not None:
                              # leave the roundabout where this way joins it
                              del chain[ring_from + k + 1:]
                              ring_from = None
                          joint = chain[-1]
                      else:
                          # a gap: carry on with the way that starts nearest to here (the gap's probably a
                          # little bit of road missing from the map; ways nowhere near go on the end)
                          joint = chain[-1]
                          near_i, near_d = None, None
                          for j in range(n):
                              if not used[j]:
                                  pts = ways[j][:-1] if closed[j] else (ways[j][0], ways[j][-1])
                                  dj = min(d2(p, joint) for p in pts)
                                  if near_d is None or dj < near_d - 1e-12 or (abs(dj - near_d) <= 1e-12 and j > cur and near_i < cur):
                                      near_i, near_d = j, dj
                          i = near_i
                          ring_from = None
                      w = ways[i]
                      used[i] = True
                      cur = i
                      if closed[i]:
                          k = min(range(len(w) - 1), key=lambda j: d2(w[j], joint))
                          ring = w[k:-1] + w[:k + 1]
                          if d2(ring[0], joint) > NEAR:
                              jumps.append(len(chain))
                          ring_from = len(chain)
                          chain += ring
                      else:
                          if d2(w[-1], joint) < d2(w[0], joint):
                              w = w[::-1]
                          if d2(w[0], joint) > NEAR:
                              jumps.append(len(chain))
                              chain += w
                          else:
                              chain += w[1:] if d2(w[0], joint) < 1e-14 else w
                  return chain, jumps

              def gap_km(cj):
                  c, j = cj
                  return sum(hav_km(c[k - 1], c[k]) for k in j)
              # (start at an end of the route: the first listed way if it's one, else the earliest listed
              # way that is. A list in a muddle can put a route's end in the middle of the list: if that
              # leaves gaps, each other end is tried, and the one with the least gap kept)
              start, flip = ends[0] if ends else (0, False)
              best = walk(start, flip)
              gap = gap_km(best)
              if gap > 0.3:
                  for i, f in ends[1:16]:
                      cj = walk(i, f)
                      g = gap_km(cj)
                      if g < gap - 0.05:
                          best, gap = cj, g
              return best


          def passes(xy, cum, pxy, tol):
              """each time the line (xy, n x 2 km) comes within tol km of a point: [(s along it, distance)]"""
              a = xy[:-1]
              d = xy[1:] - a
              L = np.hypot(d[:, 0], d[:, 1])
              L2 = np.maximum(L * L, 1e-18)
              t = np.clip(((pxy[0] - a[:, 0]) * d[:, 0] + (pxy[1] - a[:, 1]) * d[:, 1]) / L2, 0.0, 1.0)
              dist = np.hypot(pxy[0] - (a[:, 0] + t * d[:, 0]), pxy[1] - (a[:, 1] + t * d[:, 1]))
              idx = np.nonzero(dist <= tol)[0]
              if not len(idx):
                  return []
              out = []
              for run in np.split(idx, np.nonzero(np.diff(idx) > 1)[0] + 1):
                  j = int(run[np.argmin(dist[run])])
                  sv = float(cum[j] + t[j] * L[j])
                  # (two bits of one pass, a little apart: the closer one)
                  if out and sv - out[-1][0] < 0.08:
                      if dist[j] < out[-1][1]:
                          out[-1] = (sv, float(dist[j]))
                      continue
                  out.append((sv, float(dist[j])))
              return out


          def in_order(cands):
              """the most stops, in their listed order, that also go forward along the line: each stop has
              some places it's passed [(s, d)]; returns [(index in the list, s)]"""
              import bisect
              tails, tail_at, back = [], [], {}
              for k, cs in enumerate(cands):
                  for s, _ in sorted(cs, reverse=True):
                      pos = bisect.bisect_left(tails, s)
                      node = (k, s)
                      back[node] = tail_at[pos - 1] if pos else None
                      if pos == len(tails):
                          tails.append(s)
                          tail_at.append(node)
                      else:
                          tails[pos] = s
                          tail_at[pos] = node
              out = []
              node = tail_at[-1] if tail_at else None
              while node is not None:
                  out.append(node)
                  node = back[node]
              return out[::-1]


          def project_along(xy, pxy, start_s):
              """closest point of the polyline xy (n, 2 km) to pxy at arc length >= start_s -> (s, dist, point)"""
              a = xy[:-1]
              d = xy[1:] - a
              L = np.hypot(d[:, 0], d[:, 1])
              cum = np.concatenate([[0.0], np.cumsum(L)])
              L2 = np.maximum(L * L, 1e-18)
              t = ((pxy[0] - a[:, 0]) * d[:, 0] + (pxy[1] - a[:, 1]) * d[:, 1]) / L2
              t = np.clip(t, 0.0, 1.0)
              tmin = np.clip((start_s - cum[:-1]) / np.maximum(L, 1e-18), 0.0, 1.0)
              t = np.maximum(t, tmin)
              ok = cum[1:] >= start_s - 1e-9
              qx = a[:, 0] + t * d[:, 0]
              qy = a[:, 1] + t * d[:, 1]
              dd = np.where(ok, np.hypot(pxy[0] - qx, pxy[1] - qy), 1e18)
              k = int(np.argmin(dd))
              return float(cum[k] + t[k] * L[k]), float(dd[k]), cum


          def piece(xy, cum, s0, s1):
              """the polyline between arc lengths s0 and s1"""
              if s1 <= s0:
                  return []
              i0 = int(np.searchsorted(cum, s0, side='right'))
              i1 = int(np.searchsorted(cum, s1, side='left'))
              return [tuple(p) for p in xy[i0:i1]]


          def route_ends(t):
              fr, to = t.get('from'), t.get('to')
              if fr and to:
                  return fr, to
              nm = t.get('name', '')
              m = re.search(r':\s*(.+?)\s*(?:=>|->|→|<=>|↔| - | – | to )\s*(.+)$', nm)
              if m:
                  return m.group(1), re.sub(r'\s+via\s+.*$', '', m.group(2), flags=re.I)
              return None, None


          def road_graph(R, rel, kx, ky):
              """the relation's ways as a network of points (km), joined wherever ways share a node"""
              vid, pts, adj = {}, [], defaultdict(list)
              a_list, b_list = [], []
              for typ, ref, role in rel['members']:
                  if typ != 'w' or role not in GEOM_ROLES:
                      continue
                  c = R.way_geom.get(ref)
                  if c is None or len(c) < 2:
                      continue
                  prev = None
                  for lon, lat in c:
                      k = (round(float(lon), 7), round(float(lat), 7))
                      v = vid.get(k)
                      if v is None:
                          v = len(pts)
                          vid[k] = v
                          pts.append((float(lon) * kx, float(lat) * ky))
                      if prev is not None and prev != v:
                          w = math.hypot(pts[v][0] - pts[prev][0], pts[v][1] - pts[prev][1])
                          adj[prev].append((v, w))
                          adj[v].append((prev, w))
                          a_list.append(prev)
                          b_list.append(v)
                      prev = v
              if not a_list:
                  return None
              P = np.array(pts)
              return {'p': P, 'adj': adj, 'a': np.array(a_list), 'b': np.array(b_list)}


          def snap(G, q):
              """the nearest point of the network to q: (edge, t along it, distance)"""
              A, B = G['p'][G['a']], G['p'][G['b']]
              d = B - A
              L2 = np.maximum((d * d).sum(1), 1e-18)
              t = np.clip(((q[0] - A[:, 0]) * d[:, 0] + (q[1] - A[:, 1]) * d[:, 1]) / L2, 0.0, 1.0)
              dist = np.hypot(q[0] - (A[:, 0] + t * d[:, 0]), q[1] - (A[:, 1] + t * d[:, 1]))
              e = int(np.argmin(dist))
              return e, float(t[e]), float(dist[e])


          def route_between(G, sa, sb):
              """the shortest way along the network from one snapped point to another: [(x, y)] km, or None"""
              import heapq
              P, adj = G['p'], G['adj']
              ea, ta, _ = sa
              eb, tb, _ = sb
              a1, a2 = int(G['a'][ea]), int(G['b'][ea])
              b1, b2 = int(G['a'][eb]), int(G['b'][eb])
              qa = P[a1] + (P[a2] - P[a1]) * ta
              qb = P[b1] + (P[b2] - P[b1]) * tb
              La = math.hypot(*(P[a2] - P[a1]))
              Lb = math.hypot(*(P[b2] - P[b1]))
              if ea == eb:
                  return [tuple(qa), tuple(qb)], math.hypot(*(qb - qa))
              dist, back = {a1: ta * La, a2: (1 - ta) * La}, {a1: None, a2: None}
              goal = {b1: tb * Lb, b2: (1 - tb) * Lb}
              heap = [(dist[a1], a1), (dist[a2], a2)]
              heapq.heapify(heap)
              best, best_v = None, None
              done = set()
              while heap:
                  c, v = heapq.heappop(heap)
                  if v in done:
                      continue
                  if best is not None and c >= best:
                      break
                  done.add(v)
                  if v in goal and (best is None or c + goal[v] < best):
                      best, best_v = c + goal[v], v
                  for u, w in adj[v]:
                      nc = c + w
                      if nc < dist.get(u, 1e18):
                          dist[u] = nc
                          back[u] = v
                          heapq.heappush(heap, (nc, u))
              if best_v is None:
                  return None, None
              path = []
              v = best_v
              while v is not None:
                  path.append(tuple(P[v]))
                  v = back[v]
              return [tuple(qa)] + path[::-1] + [tuple(qb)], best


          def chain_by_stops(R, rel, seq, stops, kx, ky, near):
              """when a relation's ways are muddled: its line, made by going from each listed stop to the
              next along its own ways. Returns (chain lon/lat, jumps) or None if the stops are muddled too."""
              G = road_graph(R, rel, kx, ky)
              if G is None:
                  return None
              total_net = float(np.hypot(*(G['p'][G['b']] - G['p'][G['a']]).T).sum())
              snaps = []
              for sid in seq:
                  st = stops[sid]
                  sn = snap(G, (st['lon'] * kx, st['lat'] * ky))
                  if sn[2] <= max(near, 0.06):
                      snaps.append(sn)
              if len(snaps) < 2:
                  return None
              pts, jumps, run = [], [], 0.0
              for i in range(1, len(snaps)):
                  path, L = route_between(G, snaps[i - 1], snaps[i])
                  straight = math.hypot(*(np.subtract(path[-1], path[0]))) if path else 0.0
                  # (no way there, or only a long way round: a gap)
                  if path is None or (L > 3 * straight + 1.5):
                      P0 = G['p']
                      e, t, _ = snaps[i]
                      q = P0[G['a'][e]] + (P0[G['b'][e]] - P0[G['a'][e]]) * t
                      if not pts:
                          e0, t0, _ = snaps[i - 1]
                          pts.append(tuple(P0[G['a'][e0]] + (P0[G['b'][e0]] - P0[G['a'][e0]]) * t0))
                      jumps.append(len(pts))
                      pts.append(tuple(q))
                      continue
                  run += L
                  pts += path[1:] if pts else path
              # (going back and forth all over its own roads: the stops are in no useful order)
              if run > 3 * total_net + 2:
                  return None
              return [(x / kx, y / ky) for x, y in pts], jumps


          # ---------------------------------------------------------------- roads: to join the gaps in a bus route's line
          # (a route's list of roads in the map data often misses a bit out: rather than a straight line
          # across fields and houses there, the bus goes the way the real roads go)
          BUS_ROADS = {'motorway': 1.0, 'motorway_link': 1.0, 'trunk': 1.0, 'trunk_link': 1.0, 'primary': 1.0,
                       'primary_link': 1.0, 'secondary': 1.0, 'secondary_link': 1.0, 'tertiary': 1.05, 'tertiary_link': 1.05,
                       'unclassified': 1.15, 'residential': 1.25, 'road': 1.3, 'living_street': 1.6, 'service': 1.8,
                       'busway': 0.9, 'bus_guideway': 0.9}
          NOT_FOR_BUSES = {'parking_aisle', 'driveway', 'drive-through', 'emergency_access', 'alley'}
          FILL_MAX = 6.0      # (km: a gap longer than this isn't a bit of road missing from a list)


          class Roads:
              """first time round, the gaps every bus route needs joining; then the roads round them
              (read from the map, packed tight: there can be millions of bits of road), and the way along
              them from one side of each gap to the other"""
              CELL = 0.002

              def __init__(self):
                  self.boxes = []
                  self.asked = set()
                  self.loaded = False
                  self.cache = {}
                  self.xs, self.ys = array('d'), array('d')      # each point: lon, lat
                  self.eu, self.ev = array('i'), array('i')      # each bit of road: from, to
                  self.off = self.nbr = self.ncost = None        # each point's bits of road, either way
                  self.grid = {}                                 # cell -> the bits of road in it

              def ask(self, a, b):
                  """the road from a to b (lon, lat) as [(lon, lat)], or None"""
                  d = hav_km(a, b)
                  if d < 0.05 or d > FILL_MAX:
                      return None
                  key = (round(a[0], 6), round(a[1], 6), round(b[0], 6), round(b[1], 6))
                  if not self.loaded:
                      if key not in self.asked:
                          self.asked.add(key)
                          m = 0.4 + 0.3 * d
                          dy = m / 110.574
                          dx = m / (111.320 * math.cos(math.radians((a[1] + b[1]) / 2)))
                          self.boxes.append((min(a[0], b[0]) - dx, min(a[1], b[1]) - dy, max(a[0], b[0]) + dx, max(a[1], b[1]) + dy))
                      return None
                  if key not in self.cache:
                      self.cache[key] = self.route(a, b, d)
                  return self.cache[key]

              def load(self, path):
                  """the roads buses can use that go near any of the gaps"""
                  self.loaded = True
                  if not self.boxes:
                      return
                  cell = 0.02
                  bgrid = defaultdict(list)
                  for i, (x0, y0, x1, y1) in enumerate(self.boxes):
                      for gx in range(math.floor(x0 / cell), math.floor(x1 / cell) + 1):
                          for gy in range(math.floor(y0 / cell), math.floor(y1 / cell) + 1):
                              bgrid[(gx, gy)].append(i)
                  boxes, C = self.boxes, self.CELL
                  xs, ys, eu, ev, grid = self.xs, self.ys, self.eu, self.ev, self.grid
                  cf, cb = array('f'), array('f')
                  idx = {}
                  nways = 0
                  fp = osmium.FileProcessor(path, osmium.osm.NODE | osmium.osm.WAY).with_locations().with_filter(osmium.filter.KeyFilter('highway'))
                  for o in fp:
                      if not o.is_way():
                          continue
                      t = o.tags
                      hw = t.get('highway')
                      f = BUS_ROADS.get(hw)
                      if f is None or t.get('area') == 'yes' or t.get('service') in NOT_FOR_BUSES:
                          continue
                      if t.get('access') in ('no', 'private') and t.get('bus') not in ('yes', 'designated') and \
                              t.get('psv') not in ('yes', 'designated'):
                          continue
                      try:
                          nds = [(n.ref, n.location.lon, n.location.lat) for n in o.nodes]
                      except osmium.InvalidLocationError:
                          continue
                      if len(nds) < 2:
                          continue
                      lons = [n[1] for n in nds]
                      lats = [n[2] for n in nds]
                      x0, x1, y0, y1 = min(lons), max(lons), min(lats), max(lats)
                      hit = False
                      for gx in range(math.floor(x0 / cell), math.floor(x1 / cell) + 1):
                          for gy in range(math.floor(y0 / cell), math.floor(y1 / cell) + 1):
                              for i in bgrid.get((gx, gy), ()):
                                  b = boxes[i]
                                  if x0 <= b[2] and x1 >= b[0] and y0 <= b[3] and y1 >= b[1]:
                                      hit = True
                                      break
                              if hit:
                                  break
                          if hit:
                              break
                      if not hit:
                          continue
                      nways += 1
                      ow = t.get('oneway', '')
                      if t.get('junction') in ('roundabout', 'circular') or hw in ('motorway', 'motorway_link'):
                          ow = ow or 'yes'
                      if t.get('oneway:bus') == 'no' or t.get('oneway:psv') == 'no':
                          ow = 'no'
                      # (the wrong way down a one way street only if there's no other way)
                      pf = 4.0 if ow == '-1' else 1.0
                      pb = 4.0 if ow in ('yes', 'true', '1') else 1.0
                      kx = 111.320 * math.cos(math.radians(nds[0][2]))
                      prev = None
                      for ref, lon, lat in nds:
                          i = idx.get(ref)
                          if i is None:
                              i = len(xs)
                              idx[ref] = i
                              xs.append(lon)
                              ys.append(lat)
                          if prev is not None and prev[0] != i:
                              L = math.hypot((lon - prev[1]) * kx, (lat - prev[2]) * 110.574)
                              e = len(eu)
                              eu.append(prev[0])
                              ev.append(i)
                              cf.append(L * f * pf)
                              cb.append(L * f * pb)
                              for gx in range(math.floor(min(lon, prev[1]) / C), math.floor(max(lon, prev[1]) / C) + 1):
                                  for gy in range(math.floor(min(lat, prev[2]) / C), math.floor(max(lat, prev[2]) / C) + 1):
                                      g = grid.get((gx, gy))
                                      if g is None:
                                          g = grid[(gx, gy)] = array('i')
                                      g.append(e)
                          prev = (i, lon, lat)
                  del idx
                  # (each point's bits of road, both ways along them, one after another)
                  n, m = len(xs), len(eu)
                  off = array('i', [0]) * (n + 1)
                  for k in range(m):
                      off[eu[k] + 1] += 1
                      off[ev[k] + 1] += 1
                  for i in range(n):
                      off[i + 1] += off[i]
                  at = array('i', off)
                  nbr = array('i', [0]) * (2 * m)
                  ncost = array('f', [0.0]) * (2 * m)
                  for k in range(m):
                      u, v = eu[k], ev[k]
                      j = at[u]
                      nbr[j], ncost[j] = v, cf[k]
                      at[u] = j + 1
                      j = at[v]
                      nbr[j], ncost[j] = u, cb[k]
                      at[v] = j + 1
                  self.off, self.nbr, self.ncost = off, nbr, ncost
                  log('roads round', len(self.boxes), 'gaps in bus routes:', nways, 'ways,', n, 'points')

              def snap(self, p, lim=0.15):
                  """the nearest bit of road to p: (km away, point, point, how far along)"""
                  C = self.CELL
                  gx, gy = math.floor(p[0] / C), math.floor(p[1] / C)
                  kx, ky = 111.320 * math.cos(math.radians(p[1])), 110.574
                  xs, ys, eu, ev = self.xs, self.ys, self.eu, self.ev
                  best = None
                  for dx in (-1, 0, 1):
                      for dy in (-1, 0, 1):
                          for e in self.grid.get((gx + dx, gy + dy), ()):
                              u, v = eu[e], ev[e]
                              ax, ay = (xs[u] - p[0]) * kx, (ys[u] - p[1]) * ky
                              ex, ey = (xs[v] - xs[u]) * kx, (ys[v] - ys[u]) * ky
                              L2 = ex * ex + ey * ey
                              t = 0.0 if L2 < 1e-12 else max(0.0, min(1.0, -(ax * ex + ay * ey) / L2))
                              d = math.hypot(ax + t * ex, ay + t * ey)
                              if best is None or d < best[0]:
                                  best = (d, u, v, t)
                  return best if best is not None and best[0] <= lim else None

              def cost(self, u, v):
                  best = 1e9
                  for k in range(self.off[u], self.off[u + 1]):
                      if self.nbr[k] == v and self.ncost[k] < best:
                          best = self.ncost[k]
                  return best

              def route(self, a, b, d):
                  import heapq
                  sa, sb = self.snap(a), self.snap(b)
                  if not sa or not sb:
                      return None
                  _, ua, va, ta = sa
                  _, ub, vb, tb = sb
                  xs, ys, off, nbr, ncost = self.xs, self.ys, self.off, self.nbr, self.ncost

                  def at(u, v, t):
                      return (xs[u] + (xs[v] - xs[u]) * t, ys[u] + (ys[v] - ys[u]) * t)
                  qa, qb = at(ua, va, ta), at(ub, vb, tb)
                  if {ua, va} == {ub, vb}:
                      return [qa, qb]
                  kx, ky = 111.320 * math.cos(math.radians((a[1] + b[1]) / 2)), 110.574
                  tx, ty = qb[0] * kx, qb[1] * ky

                  def h(n):
                      return 0.9 * math.hypot(tx - xs[n] * kx, ty - ys[n] * ky)
                  dist, back, heap = {}, {}, []
                  for n, c in ((va, (1 - ta) * self.cost(ua, va)), (ua, ta * self.cost(va, ua))):
                      if c < dist.get(n, 1e18):
                          dist[n], back[n] = c, None
                          heapq.heappush(heap, (c + h(n), c, n))
                  goal = {ub: tb * self.cost(ub, vb), vb: (1 - tb) * self.cost(vb, ub)}
                  limit = 2.5 * d + 2.0
                  best, best_n, done = None, None, set()
                  while heap:
                      fc, c, n = heapq.heappop(heap)
                      if n in done:
                          continue
                      if fc > limit or (best is not None and fc >= best):
                          break
                      done.add(n)
                      if n in goal and (best is None or c + goal[n] < best):
                          best, best_n = c + goal[n], n
                      for k in range(off[n], off[n + 1]):
                          w = nbr[k]
                          nc = c + ncost[k]
                          if nc < dist.get(w, 1e18):
                              dist[w], back[w] = nc, n
                              heapq.heappush(heap, (nc + h(w), nc, w))
                  if best_n is None:
                      return None
                  path, n = [], best_n
                  while n is not None:
                      path.append((xs[n], ys[n]))
                      n = back[n]
                  pts = [qa] + path[::-1] + [qb]
                  if sum(hav_km(pts[i - 1], pts[i]) for i in range(1, len(pts))) > 1.8 * d + 1.0:
                      return None
                  return pts


          def order_pieces(chain, jumps):
              """the bits of a line between its gaps, put in the order (each either way round) that makes
              the gaps shortest: a line the list put together from the middle then goes end to end, instead
              of out to one end and back over itself"""
              if not jumps:
                  return chain, jumps
              cuts = [0] + list(jumps) + [len(chain)]
              pieces = [chain[cuts[i]:cuts[i + 1]] for i in range(len(cuts) - 1)]
              pieces = [q for q in pieces if q]
              n = len(pieces)
              if n < 2 or n > 40:
                  return chain, jumps
              before = sum(hav_km(chain[k - 1], chain[k]) for k in jumps)
              best = None
              for first in range(n):
                  for rev in (False, True):
                      used = [False] * n
                      used[first] = True
                      cur = pieces[first][::-1] if rev else pieces[first]
                      order, total, end = [cur], 0.0, cur[-1]
                      for _ in range(n - 1):
                          bj, br, bd = None, None, None
                          for j in range(n):
                              if used[j]:
                                  continue
                              for r in (False, True):
                                  d = hav_km(end, pieces[j][-1] if r else pieces[j][0])
                                  if bd is None or d < bd:
                                      bj, br, bd = j, r, d
                          used[bj] = True
                          q = pieces[bj][::-1] if br else pieces[bj]
                          order.append(q)
                          total += bd
                          end = q[-1]
                      if best is None or total < best[0] - 1e-9:
                          best = (total, order)
              total, order = best
              if total > 0.5 * before or before - total < 0.5:
                  return chain, jumps
              out, left = [], []
              for q in order:
                  if out:
                      left.append(len(out))
                  out += q
              return out, left


          def join_gaps(chain, jumps, roads):
              """a line's gaps joined along the roads where they can be: (line, the gaps left, how many joined)"""
              if not jumps or roads is None:
                  return chain, jumps, 0
              out, left, last, n = [], [], 0, 0
              for k in jumps:
                  out += chain[last:k]
                  path = roads.ask(chain[k - 1], chain[k]) if hav_km(chain[k - 1], chain[k]) > 0.1 else None
                  if path:
                      out += path
                      n += 1
                  else:
                      left.append(len(out))
                  last = k
              out += chain[last:]
              return out, left, n


          def line_from_stops(seq, stops, roads):
              """a bus route with no roads listed at all: along the roads from each stop to the next
              (only if they're listed in an order that makes sense: each one near the last)"""
              pts = [(stops[s]['lon'], stops[s]['lat']) for s in seq]
              gaps = sorted(hav_km(pts[i - 1], pts[i]) for i in range(1, len(pts)))
              if roads is None or not gaps or gaps[-1] > FILL_MAX or gaps[len(gaps) // 2] > 1.5:
                  return [], []
              chain, jumps = [pts[0]], []
              for i in range(1, len(pts)):
                  path = roads.ask(pts[i - 1], pts[i])
                  if path:
                      chain += path
                  else:
                      jumps.append(len(chain))
                  chain.append(pts[i])
              return chain, jumps


          # how far a stop can be from its route's line, and the longest gap in the line that's joined
          # with a straight bit (km). Buses never go in a straight line where there's no road in the data:
          # a route with a bigger gap than that keeps its longest part that has the road all the way.
          STOP_NEAR = {'bus': 0.06, 'tram': 0.08, 'metro': 0.25, 'train': 0.35, 'ferry': 0.6}
          GAP_OK = {'bus': 0.5, 'tram': 0.5, 'metro': 1.0, 'train': 1.5, 'ferry': 1e9}


          def roundabout_middles(rounds):
              """the points of each roundabout a route goes round (one small enough to go straight across)
              -> its middle: a route's line goes through the middle, like on a transport map, so routes
              going round it different ways (or in and out at different sides) meet there instead of
              splitting round it"""
              uf = UF()
              first = {}
              for k, r in enumerate(rounds):
                  uf.find(k)
                  for e in (r[0], r[1]):
                      j = first.setdefault(e, k)
                      if j != k:
                          uf.union(j, k)
              boxes = {}
              for k, r in enumerate(rounds):
                  g = uf.find(k)
                  b = boxes.get(g)
                  boxes[g] = (min(b[0], r[2]), min(b[1], r[3]), max(b[2], r[4]), max(b[3], r[5])) if b else r[2:6]
              at = {}
              for k, r in enumerate(rounds):
                  if r[6] is None:
                      continue
                  b = boxes[uf.find(k)]
                  # (a big one's middle can be buildings or a park: routes keep going round that)
                  if hav_km((b[0], b[1]), (b[2], b[3])) > 0.11:
                      continue
                  mid = ((b[0] + b[2]) / 2, (b[1] + b[3]) / 2)
                  for q in r[6]:
                      at[q] = mid
              return at


          def through_middles(pts, at):
              """a line that goes round a roundabout (two or more of its points in a row) goes through its
              middle instead"""
              if not at or len(pts) < 2:
                  return pts
              keys = [at.get(pkey(p)) for p in pts]
              out, k, n = [], 0, len(pts)
              while k < n:
                  c = keys[k]
                  if c is None:
                      out.append(pts[k])
                      k += 1
                      continue
                  j = k
                  while j + 1 < n and keys[j + 1] == c:
                      j += 1
                  if j > k:
                      out.append(c)
                  else:
                      out.append(pts[k])
                  k = j + 1
              return out


          def build_routes(R, stops, stop_of, roads=None):
              out = []
              loose = None
              fixed = Counter()
              round_at = getattr(R, 'round_at', None)
              for rid, rel in R.routes.items():
                  t = rel['tags']
                  mode = ROUTE_MODES[t['route']]
                  nm = (t.get('name', '') + ' ' + t.get('description', '')).lower()
                  if any(w in nm for w in SKIP_WORDS) or t.get('disused') == 'yes' or t.get('state') in ('proposed', 'disused'):
                      continue
                  # stops: the stop positions, or else the platforms (in the order listed: often wrong)
                  seq_s, seq_p = [], []
                  for typ, ref, role in rel['members']:
                      if typ not in ('n', 'w'):
                          continue
                      k = (typ, ref)
                      sid = stop_of.get(k)
                      if not sid:
                          continue
                      if role.startswith('stop'):
                          seq_s.append(sid)
                      elif role.startswith('platform'):
                          seq_p.append(sid)
                  seq = seq_s if len(set(seq_s)) >= 2 else seq_p
                  dedup = []
                  for s in seq:
                      if not dedup or dedup[-1] != s:
                          dedup.append(s)
                  seq = dedup
                  chain, jumps = chain_of(R, rel)
                  if mode != 'ferry' and jumps:
                      ordered = order_pieces(chain, jumps)
                      if ordered[0] is not chain:
                          chain, jumps = ordered
                          fixed['line put end to end'] += 1
                  near = STOP_NEAR[mode]
                  if len(chain) < 2 and mode == 'bus' and len(seq) >= 2:
                      chain, jumps = line_from_stops(seq, stops, roads)
                      if len(chain) >= 2:
                          fixed['line made along the roads from stop to stop'] += 1
                  if len(chain) >= 2:
                      lat0 = chain[0][1]
                  elif seq:
                      lat0 = stops[seq[0]]['lat']
                  else:
                      continue
                  kx, ky = local_proj(lat0)
                  if len(chain) >= 2 and jumps and mode != 'ferry' and len(seq) >= 2:
                      big = [k for k in jumps if hav_km(chain[k - 1], chain[k]) > GAP_OK[mode]]
                      if big:
                          better = chain_by_stops(R, rel, seq, stops, kx, ky, near)
                          if better and len(better[0]) >= 2:
                              nb = [k for k in better[1] if hav_km(better[0][k - 1], better[0][k]) > GAP_OK[mode]]
                              if len(nb) < len(big):
                                  chain, jumps = better
                                  fixed['line rebuilt from its stops'] += 1
                  if len(chain) >= 2 and jumps and mode == 'bus':
                      chain, jumps, nj = join_gaps(chain, jumps, roads)
                      if nj:
                          fixed['gaps joined along the roads'] += 1

                  def P(lon, lat):
                      return (lon * kx, lat * ky)
                  placed = []   # [(stop id, s along the line)]
                  if len(chain) >= 2:
                      xy = np.array([P(lon, lat) for lon, lat in chain])
                      L = np.hypot(*(xy[1:] - xy[:-1]).T)
                      cum = np.concatenate([[0.0], np.cumsum(L)])
                      # (lots of bus routes only list their two ends: then it's the stops it passes on the way)
                      if t['route'] in ('bus', 'trolleybus', 'minibus', 'tram') and cum[-1] / max(1, len(seq) - 1) > 1.0:
                          if loose is None:
                              loose = defaultdict(list)
                              for s in stops.values():
                                  loose[(int(s['lon'] / 0.003), int(s['lat'] / 0.003))].append(s)
                          seen = set(seq)
                          for lon, lat in chain[::2]:
                              gx, gy = int(lon / 0.003), int(lat / 0.003)
                              for dx in (-1, 0, 1):
                                  for dy in (-1, 0, 1):
                                      for s in loose.get((gx + dx, gy + dy), ()):
                                          if s['id'] not in seen:
                                              seen.add(s['id'])
                                              ps = passes(xy, cum, P(s['lon'], s['lat']), 0.035)
                                              if ps:
                                                  placed.append((s['id'], ps[0][0]))
                          for sid in seq:
                              ps = passes(xy, cum, P(stops[sid]['lon'], stops[sid]['lat']), max(near, 0.4))
                              if ps:
                                  placed.append((sid, ps[0][0]))
                          placed.sort(key=lambda x: x[1])
                          fixed['stops found along it'] += 1
                      else:
                          cands = [passes(xy, cum, P(stops[sid]['lon'], stops[sid]['lat']), near) for sid in seq]
                          on = sum(1 for c in cands if c)
                          best = in_order(cands)
                          if on >= 2 and len(best) < 0.8 * on:
                              # (the line might have been put together the other way round)
                              rc = chain[::-1]
                              rxy = xy[::-1].copy()
                              rL = np.hypot(*(rxy[1:] - rxy[:-1]).T)
                              rcum = np.concatenate([[0.0], np.cumsum(rL)])
                              rcands = [passes(rxy, rcum, P(stops[sid]['lon'], stops[sid]['lat']), near) for sid in seq]
                              rbest = in_order(rcands)
                              if len(rbest) > len(best):
                                  chain, xy, cum, cands, best = rc, rxy, rcum, rcands, rbest
                                  jumps = sorted(len(rc) - k for k in jumps)
                          if on >= 2 and len(best) >= 0.8 * on:
                              placed = [(seq[k], s) for k, s in best]
                              if len(best) < len(seq):
                                  fixed['stops off its line dropped'] += 1
                          elif on >= 2:
                              # (the list is in no useful order: each stop where the route first gets to it)
                              placed = sorted(((sid, c[0][0]) for sid, c in zip(seq, cands) if c), key=lambda x: x[1])
                              fixed['stops put in order'] += 1
                  else:
                      if mode != 'ferry' and mode != 'train':
                          fixed['no line: left out'] += 1
                          continue
                      placed = [(sid, None) for sid in seq]
                  # (the same stop twice in a row: both sides of the road, or stands at a bus station)
                  tidy = []
                  for sid, sv in placed:
                      if tidy:
                          a, b = stops[tidy[-1][0]], stops[sid]
                          d = hav_km((a['lon'], a['lat']), (b['lon'], b['lat']))
                          if sid == tidy[-1][0] or d < 0.1 or (d < 0.5 and name_key(a['name']) and name_key(a['name']) == name_key(b['name'])):
                              continue
                      tidy.append((sid, sv))
                  placed = tidy
                  if len(set(sid for sid, _ in placed)) < 2:
                      continue
                  # the line between each stop and the next; a gap too big to join splits the route
                  segs = [[] for _ in placed]
                  ok = [True] * len(placed)
                  if len(chain) >= 2:
                      jump_s = [(cum[k - 1], cum[k]) for k in jumps]
                      for i in range(1, len(placed)):
                          s0, s1 = placed[i - 1][1], placed[i][1]
                          if any(a < s1 and b > s0 and b - a > GAP_OK[mode] for a, b in jump_s):
                              ok[i] = False
                              continue
                          segs[i] = [(x / kx, y / ky) for x, y in piece(xy, cum, s0, s1)]
                  if not all(ok[1:]):
                      # (the longest run of stops joined by road all the way)
                      best_lo, best_hi, lo = 0, 0, 0
                      for i in range(1, len(placed)):
                          if not ok[i]:
                              lo = i
                          elif i - lo > best_hi - best_lo:
                              best_lo, best_hi = lo, i
                      if best_hi - best_lo < 1:
                          fixed['no road between stops: left out'] += 1
                          continue
                      placed = placed[best_lo:best_hi + 1]
                      segs = [[]] + segs[best_lo + 1:best_hi + 1]
                      fixed['gap in its line: kept the longest part'] += 1
                  seq = [sid for sid, _ in placed]
                  # (simplify each piece: about 4 m)
                  km = [0.0]
                  enc = [[]]
                  for i in range(1, len(seq)):
                      a, b = stops[seq[i - 1]], stops[seq[i]]
                      pts = [(a['lon'], a['lat'])] + through_middles(segs[i], round_at) + [(b['lon'], b['lat'])]
                      if len(pts) > 2:
                          ls = LineString([P(*p) for p in pts]).simplify(0.004)
                          pts = [(x / kx, y / ky) for x, y in ls.coords]
                      L = sum(hav_km(pts[j - 1], pts[j]) for j in range(1, len(pts)))
                      km.append(round(max(L, 0.01), 3))
                      mid = pts[1:-1]
                      ints = [(e5(p[1]), e5(p[0])) for p in mid]
                      start = (e5(a['lat']), e5(a['lon']))
                      flat, px, py = [], start[0], start[1]
                      for x, y in ints:
                          flat += [x - px, y - py]
                          px, py = x, y
                      enc.append(flat)
                  m = R.masters.get(rid)
                  mt = m[1] if m else {}
                  ref = (t.get('ref') or mt.get('ref') or '').strip()
                  fr, to = route_ends(t)
                  first, last = stops[seq[0]]['name'], stops[seq[-1]]['name']
                  if not fr or not to:
                      fr, to = first or fr, last or to
                  name = f'{clean_name(fr)} - {clean_name(to)}' if fr and to and clean_name(fr) != clean_name(to) else \
                      (clean_name(fr) + ' circular' if fr else (t.get('name') or mt.get('name') or ref or 'Route'))
                  col = colour_of(t.get('colour'), mt.get('colour')) or pick_colour(mode + ':' + (ref or name))
                  out.append({'id': 'r' + str(rid), 'rid': rid, 'mode': mode, 'ref': ref[:12], 'name': name[:60], 'col': col,
                              'op': (t.get('operator') or mt.get('operator') or '')[:40], 'net': (t.get('network') or mt.get('network') or '')[:40],
                              'master': m[0] if m else None, 'stops': seq, 'g': enc, 'km': km, 'total': sum(km)})
              log('routes with at least two stops', len(out), dict(fixed))
              return out


          def pick_routes(routes):
              """one route per real route (its longest direction), plus any branch that's really different"""
              groups = defaultdict(list)
              for r in routes:
                  if r['master']:
                      key = ('m', r['master'])
                  elif r['ref']:
                      key = ('r', r['mode'], r['ref'].upper(), r['net'] or r['op'])
                  else:
                      key = ('n', r['mode'], r['name'])
                  groups[key].append(r)
              keep, alias = [], {}
              for key, rs in groups.items():
                  rs.sort(key=lambda r: (-len(r['stops']), -r['total'], r['rid']))
                  kept = []
                  for r in rs:
                      s = set(r['stops'])
                      share = [(len(s & set(k['stops'])) / max(1, len(s)), k['id']) for k in kept]
                      same = max(share) if share else (0, None)
                      if same[0] >= 0.5:
                          alias[r['id']] = same[1]
                          continue
                      kept.append(r)
                  keep += kept
              log('routes after merging directions', len(keep), 'from', len(routes))
              return keep, alias


          # ---------------------------------------------------------------- step 5: places (council areas)
          def build_places(R, stops):
              adm = [a for a in R.admin if a[4] is not None and not a[4].is_empty]
              if not adm:
                  log('no council areas found')
                  return [], {}
              polys = [a[4] for a in adm]
              tree = STRtree(polys)
              ids = list(stops)
              pts = shapely.points([stops[s]['lon'] for s in ids], [stops[s]['lat'] for s in ids])
              pi, ai = tree.query(pts, predicate='within')
              best = {}
              for p, a in zip(pi.tolist(), ai.tolist()):
                  lvl = adm[a][2]
                  if p not in best or lvl > adm[best[p]][2]:
                      best[p] = a
              place_of = {}
              used = defaultdict(int)
              for p, a in best.items():
                  place_of[ids[p]] = 'a' + str(adm[a][0])
                  used[a] += 1
              # (stops just outside every area: the nearest one within 3 km)
              miss = [i for i in range(len(ids)) if i not in best]
              if miss:
                  near = tree.query_nearest(pts[miss], max_distance=0.03, return_distance=False)
                  for k, a in zip(near[0].tolist(), near[1].tolist()):
                      p = miss[k]
                      if ids[p] not in place_of:
                          place_of[ids[p]] = 'a' + str(adm[a][0])
                          used[a] += 1
              out = []
              for a, n in used.items():
                  aid, name, lvl, pop, g = adm[a]
                  out.append({'id': 'a' + str(aid), 'name': name, 'level': lvl, 'pop': pop, 'geom': g, 'stops': 0, 'routes': 0})
              log('places', len(out), 'stops placed', len(place_of), 'of', len(ids))
              return out, place_of


          def enc_rings(geom, tol):
              try:
                  g = shapely.make_valid(geom).simplify(tol, preserve_topology=True)
              except Exception:
                  return []
              rings = []
              for poly in getattr(g, 'geoms', [g]):
                  if poly.is_empty or poly.geom_type != 'Polygon':
                      continue
                  c = list(poly.exterior.coords)[:-1]
                  if len(c) < 3:
                      continue
                  rings.append(enc_deltas([(e5(lat), e5(lon)) for lon, lat in c]))
              return rings


          # ---------------------------------------------------------------- step 6: the sea
          def load_poly(path):
              """the edge of the map extract (Geofabrik's .poly file: outer rings, and holes marked with !)"""
              shells, holes = [], []
              with open(path) as f:
                  lines = [ln.strip() for ln in f if ln.strip()]
              i = 1
              while i < len(lines):
                  head = lines[i]
                  if head == 'END':
                      break
                  pts = []
                  i += 1
                  while i < len(lines) and lines[i] != 'END':
                      parts = lines[i].split()
                      pts.append((float(parts[0]), float(parts[1])))
                      i += 1
                  i += 1
                  if len(pts) >= 3:
                      (holes if head.startswith('!') else shells).append(Polygon(pts).buffer(0))
              if not shells:
                  return None
              g = shapely.union_all(shells)
              if holes:
                  g = g.difference(shapely.union_all(holes))
              return g


          def load_sea(path, bbox):
              """water polygons (osmdata.openstreetmap.de, EPSG:4326) inside bbox"""
              if not path or not os.path.exists(path):
                  log('no sea polygons file: no sea')
                  return []
              import shapefile
              rd = shapefile.Reader(path)
              out = []
              bb = box(*bbox)
              try:
                  shapes = rd.iterShapes(bbox=list(bbox))
              except TypeError:
                  shapes = rd.iterShapes()
              for sh in shapes:
                  b = sh.bbox
                  if b[2] < bbox[0] or b[0] > bbox[2] or b[3] < bbox[1] or b[1] > bbox[3]:
                      continue
                  g = shapely.geometry.shape(sh.__geo_interface__)
                  if not g.is_valid:
                      g = g.buffer(0)
                  g = g.intersection(bb)
                  if not g.is_empty:
                      out.append(g)
              log('sea pieces', len(out))
              return out


          class Sea:
              """the sea, worked out from the coastline (OpenStreetMap draws it with the land on its left)"""

              def __init__(self, ways, edge=None):
                  self.ways = ways
                  # (only inside the edge of the map extract: past it, there's no coastline to go by)
                  self.edge = edge
                  if edge is not None:
                      shapely.prepare(edge)
                  self.lines = [LineString(c) for c in ways]
                  self.tree = STRtree(self.lines) if self.lines else None
                  # points just either side of the whole coastline: land on the left, sea on the right
                  self.kd = None
                  if ways:
                      from scipy.spatial import cKDTree
                      P, L = self._sides(ways)
                      if P is not None:
                          self.kx = math.cos(math.radians(float(np.median(P[:, 1]))))
                          self.kd = cKDTree(np.column_stack([P[:, 0] * self.kx, P[:, 1]]))
                          self.klab = L

              @staticmethod
              def _sides(ways, bounds=None):
                  pts, lab = [], []
                  for c in ways:
                      a, b = c[:-1], c[1:]
                      m = (a + b) / 2
                      if bounds is not None:
                          x0, y0, x1, y1 = bounds
                          ok = (m[:, 0] >= x0) & (m[:, 0] <= x1) & (m[:, 1] >= y0) & (m[:, 1] <= y1)
                          if not ok.any():
                              continue
                          a, b, m = a[ok], b[ok], m[ok]
                      k = math.cos(math.radians(float(m[0, 1])))
                      dx, dy = (b[:, 0] - a[:, 0]) * k, b[:, 1] - a[:, 1]
                      L = np.hypot(dx, dy)
                      good = L > 1e-9
                      if not good.any():
                          continue
                      dx, dy, m = dx[good] / L[good], dy[good] / L[good], m[good]
                      e = 2.5e-5
                      for sgn, label in ((1, 0), (-1, 1)):
                          pts.append(np.column_stack([m[:, 0] - sgn * dy * e / k, m[:, 1] + sgn * dx * e]))
                          lab.append(np.full(len(m), label))
                  if not pts:
                      return None, None
                  return np.concatenate(pts), np.concatenate(lab)

              def _side_samples(self, idx, bb, limit=800):
                  P, Lb = self._sides([self.ways[i] for i in idx], bb.bounds)
                  if P is not None and len(P) > limit:
                      pick = np.linspace(0, len(P) - 1, limit).astype(int)
                      P, Lb = P[pick], Lb[pick]
                  return P, Lb

              def _nearest_is_sea(self, pt):
                  """which side of the coastline is this? (the closest point just beside the coastline says)"""
                  if self.kd is None:
                      return False
                  _, j = self.kd.query([pt.x * self.kx, pt.y])
                  return bool(self.klab[int(j)] == 1)

              def in_box(self, bb):
                  out = self._in_box(bb)
                  if self.edge is None or not out:
                      return out
                  if self.edge.contains(bb):
                      return out
                  clipped = []
                  for f in out:
                      try:
                          g = f.intersection(self.edge)
                      except Exception:
                          continue
                      if not g.is_empty:
                          clipped += [q for q in shapely.get_parts(g) if q.geom_type == 'Polygon' and q.area > 0]
                  return clipped

              def _in_box(self, bb):
                  if self.tree is None:
                      return []
                  idx = self.tree.query(bb)
                  if len(idx) == 0:
                      return [bb] if self._nearest_is_sea(bb.centroid) else []
                  pieces = []
                  for i in idx:
                      try:
                          g = self.lines[i].intersection(bb)
                      except Exception:
                          continue
                      if not g.is_empty:
                          pieces.append(g)
                  if not pieces:
                      return [bb] if self._nearest_is_sea(bb.centroid) else []
                  net = shapely.union_all(pieces + [bb.boundary])
                  # (the coastline stops where the map data stops: carry its loose ends to the edge of the box)
                  ends = Counter()
                  for ls in getattr(net, 'geoms', [net]):
                      if ls.geom_type == 'LineString' and len(ls.coords) >= 2:
                          ends[tuple(np.round(ls.coords[0], 9))] += 1
                          ends[tuple(np.round(ls.coords[-1], 9))] += 1
                  extra = []
                  for pt, n in ends.items():
                      if n == 1:
                          p = shapely.Point(pt)
                          if bb.boundary.distance(p) > 1e-9:
                              q = shapely.ops.nearest_points(p, bb.boundary)[1]
                              extra.append(LineString([pt, (q.x, q.y)]))
                  if extra:
                      net = shapely.union_all([net] + extra)
                  faces = [f for f in shapely.get_parts(shapely.polygonize([net])) if f.area > 0]
                  if not faces:
                      return []
                  P, Lb = self._side_samples(idx, bb)
                  out = []
                  for f in faces:
                      if P is None:
                          sea = self._nearest_is_sea(f.representative_point())
                      else:
                          inside = shapely.contains_xy(f, P[:, 0], P[:, 1])
                          ns, nl = int((Lb[inside] == 1).sum()), int((Lb[inside] == 0).sum())
                          if ns + nl == 0:
                              sea = self._nearest_is_sea(f.representative_point())
                          else:
                              sea = ns > nl
                      if sea:
                          out.append(f)
                  return out


          # ---------------------------------------------------------------- step 7: tiles
          def tri_flat(geom):
              """polygon(s) in tile coords -> flat triangle coords [x1, y1, x2, y2, x3, y3, ...]"""
              out = []
              if geom.is_empty:
                  return out
              for poly in getattr(geom, 'geoms', [geom]):
                  if poly.geom_type != 'Polygon' or poly.is_empty or poly.area < 1:
                      continue
                  try:
                      tris = shapely.constrained_delaunay_triangles(poly)
                  except Exception:
                      continue
                  for tr in getattr(tris, 'geoms', []):
                      c = list(tr.exterior.coords)[:3]
                      if len(c) < 3:
                          continue
                      q = [(int(round(x)), int(round(y))) for x, y in c]
                      # (no slivers)
                      if abs((q[1][0] - q[0][0]) * (q[2][1] - q[0][1]) - (q[2][0] - q[0][0]) * (q[1][1] - q[0][1])) < 2:
                          continue
                      out.append(q)
              # [x1 - last x1, y1 - last y1, x2 - x1, y2 - y1, x3 - x1, y3 - y1, ...]
              flat, lx, ly = [], 0, 0
              for (x1, y1), (x2, y2), (x3, y3) in out:
                  flat += [x1 - lx, y1 - ly, x2 - x1, y2 - y1, x3 - x1, y3 - y1]
                  lx, ly = x1, y1
              return flat


          CH = 4                      # chunks across a tile
          CW = EXT // CH


          def chunked_tris(u, min_area):
              """a (multi)polygon in tile coords -> [[chunk, triangles...], ...]"""
              out = []
              if u is None or u.is_empty:
                  return out
              for cy in range(CH):
                  for cx in range(CH):
                      cb = box(cx * CW, cy * CW, (cx + 1) * CW, (cy + 1) * CW)
                      try:
                          part = u.intersection(cb)
                      except Exception:
                          continue
                      if part.is_empty:
                          continue
                      polys = [p for p in getattr(part, 'geoms', [part]) if p.geom_type == 'Polygon' and p.area >= 1]
                      if not polys:
                          continue
                      flat = tri_flat(shapely.MultiPolygon(polys) if len(polys) > 1 else polys[0])
                      if flat:
                          out.append([cy * CH + cx] + flat)
              return out


          def budget_tris(u, tol, min_area, budget):
              """simplify (a little more each time) until the tile's shapes are at most `budget` triangles"""
              if u is None:
                  return []
              for k in range(8):
                  t = tol * (1.35 ** k)
                  m = min_area * (1.5 ** k)
                  g = u.simplify(t, preserve_topology=True)
                  keep = [p for p in shapely.get_parts(g) if p.geom_type == 'Polygon' and p.area >= m]
                  if not keep:
                      return []
                  out = chunked_tris(shapely.MultiPolygon(keep) if len(keep) > 1 else keep[0], 1)
                  n = sum((len(c) - 1) // 6 for c in out)
                  if n <= budget:
                      return out
              return out


          def layer_shape(geoms, x, y, z, tol, min_area, merge=0.0):
              """water/green/sand inside a tile, merged, simplified, small bits dropped (tile coords)"""
              if not geoms:
                  return None
              lon0, lat0, lon1, lat1 = tile_lonlat_box(x, y, z)
              bb = box(lon0, lat0, lon1, lat1)
              parts = []
              for g in geoms:
                  try:
                      c = g.intersection(bb)
                  except Exception:
                      try:
                          c = shapely.make_valid(g).intersection(bb)
                      except Exception:
                          continue
                  if not c.is_empty:
                      parts.append(c)
              if not parts:
                  return None
              px = [to_tile_px(p, x, y, z) for p in parts]
              try:
                  u = shapely.union_all(px)
              except Exception:
                  u = shapely.union_all([shapely.make_valid(p).buffer(0) for p in px])
              if merge > 0:
                  u = u.buffer(merge, quad_segs=2).buffer(-merge, quad_segs=2)
              u = u.intersection(box(0, 0, EXT, EXT)).simplify(tol, preserve_topology=True)
              keep = [p for p in shapely.get_parts(u) if p.geom_type == 'Polygon' and p.area >= min_area]
              if not keep:
                  return None
              return shapely.MultiPolygon(keep) if len(keep) > 1 else keep[0]


          def chunked_lines(items, x, y, z, tol, classes):
              """roads/rivers inside a tile: joined up into long lines, simplified -> [[chunk, class, deltas...], ...]"""
              lon0, lat0, lon1, lat1 = tile_lonlat_box(x, y, z)
              bb = box(lon0, lat0, lon1, lat1)
              by_cls = defaultdict(list)
              for cls, g in items:
                  if cls not in classes:
                      continue
                  try:
                      c = g.intersection(bb)
                  except Exception:
                      continue
                  if not c.is_empty:
                      by_cls[cls].append(to_tile_px(c, x, y, z))
              out = []
              for cls, gs in sorted(by_cls.items()):
                  try:
                      merged = shapely.line_merge(shapely.union_all(gs))
                  except Exception:
                      merged = shapely.MultiLineString([q for g in gs for q in shapely.get_parts(g) if q.geom_type == 'LineString'])
                  merged = merged.simplify(tol)
                  for cy in range(CH):
                      for cx in range(CH):
                          cb = box(cx * CW - 2, cy * CW - 2, (cx + 1) * CW + 2, (cy + 1) * CW + 2)
                          try:
                              part = merged.intersection(cb)
                          except Exception:
                              continue
                          for ls in shapely.get_parts(part):
                              if ls.geom_type != 'LineString' or ls.length < 4:
                                  continue
                              pts = [(int(round(px)), int(round(py))) for px, py in ls.coords]
                              out.append([cy * CH + cx, cls] + enc_deltas(pts))
              return out


          def layer_tris(geoms, x, y, z, tol, min_area):
              if not geoms:
                  return []
              lon0, lat0, lon1, lat1 = tile_lonlat_box(x, y, z)
              bb = box(lon0, lat0, lon1, lat1)
              parts = []
              for g in geoms:
                  try:
                      c = g.intersection(bb)
                  except Exception:
                      try:
                          c = shapely.make_valid(g).intersection(bb)
                      except Exception:
                          continue
                  if not c.is_empty:
                      parts.append(c)
              if not parts:
                  return []
              px = [to_tile_px(p, x, y, z) for p in parts]
              try:
                  u = shapely.union_all(px)
              except Exception:
                  u = shapely.union_all([shapely.make_valid(p).buffer(0) for p in px])
              u = u.intersection(box(0, 0, EXT, EXT)).simplify(tol, preserve_topology=True)
              if u.geom_type == 'GeometryCollection':
                  u = shapely.MultiPolygon([p for p in u.geoms if p.geom_type == 'Polygon'] +
                                           [q for p in u.geoms if p.geom_type == 'MultiPolygon' for q in p.geoms])
              keep = [p for p in getattr(u, 'geoms', [u]) if p.geom_type == 'Polygon' and p.area >= min_area]
              return tri_flat(shapely.MultiPolygon(keep) if len(keep) > 1 else (keep[0] if keep else Polygon()))


          def layer_lines(items, x, y, z, tol, classes):
              out = []
              lon0, lat0, lon1, lat1 = tile_lonlat_box(x, y, z)
              bb = box(lon0, lat0, lon1, lat1)
              for cls, g in items:
                  if cls not in classes:
                      continue
                  try:
                      c = g.intersection(bb)
                  except Exception:
                      continue
                  if c.is_empty:
                      continue
                  c = to_tile_px(c, x, y, z).simplify(tol)
                  for ls in getattr(c, 'geoms', [c]):
                      if ls.geom_type != 'LineString' or ls.length < 3:
                          continue
                      pts = [(int(round(px)), int(round(py))) for px, py in ls.coords]
                      out.append([cls] + enc_deltas(pts))
              return out


          def bucket(geoms, z, with_cls=False):
              """which tiles each shape touches"""
              b = defaultdict(list)
              for item in geoms:
                  g = item[1] if with_cls else item
                  x0, y0, x1, y1 = g.bounds
                  tx0, ty1 = tile_of(x0, y0, z)
                  tx1, ty0 = tile_of(x1, y1, z)
                  if (tx1 - tx0 + 1) * (ty1 - ty0 + 1) > 4000:
                      continue
                  for tx in range(tx0, tx1 + 1):
                      for ty in range(ty0, ty1 + 1):
                          b[(tx, ty)].append(item)
              return b


          def write_json(path, obj):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(obj, f, ensure_ascii=False, separators=(',', ':'))


          # ---------------------------------------------------------------- main
          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--pbf', required=True)
              ap.add_argument('--region', required=True)
              ap.add_argument('--name', default='')
              ap.add_argument('--out', required=True)
              ap.add_argument('--sea', default='')
              ap.add_argument('--poly', default='')
              ap.add_argument('--keep-filtered', action='store_true')
              a = ap.parse_args()
              out = os.path.join(a.out, a.region)
              os.makedirs(out, exist_ok=True)
              filtered = os.path.join(a.out, a.region + '.filtered.pbf')
              filter_pbf(a.pbf, filtered)
              R = Reader()
              R.relations(filtered)
              R.everything(filtered)
              R.round_at = roundabout_middles(R.rounds)
              log('roundabouts', len(R.rounds), 'ways;', len(R.round_at), 'points of ones routes go through the middle of')
              R.rounds = None

              stops, stop_of = build_stops(R)
              # (first time round: which gaps in bus routes need joining along the roads; then the roads round them)
              roads = Roads()
              build_routes(R, stops, stop_of, roads)
              roads.load(filtered)
              if not a.keep_filtered:
                  os.remove(filtered)
              routes, aliases = pick_routes(build_routes(R, stops, stop_of, roads))
              del roads
              used = set()
              for r in routes:
                  for i, sid in enumerate(r['stops']):
                      st = stops[sid]
                      st['modes'] |= MODE_BIT[r['mode']]
                      if r['id'] not in st['routes']:
                          st['routes'].append(r['id'])
                      used.add(sid)
              stops = {k: v for k, v in stops.items() if k in used}
              for s in stops.values():
                  if s['station']:
                      s['modes'] |= STATION_BIT
              log('stops with routes', len(stops))
              if not stops:
                  write_json(os.path.join(out, 'meta.json'), {'v': 1, 'region': a.region, 'name': a.name, 'empty': True})
                  return
              places, place_of = build_places(R, stops)
              pl_by = {p['id']: p for p in places}
              for sid, s in stops.items():
                  s['place'] = place_of.get(sid, '')
                  if s['place']:
                      pl_by[s['place']]['stops'] += 1
              for r in routes:
                  hp = stops[r['stops'][0]].get('place')
                  if hp:
                      pl_by[hp]['routes'] += 1

              # routes
              rinfo = {}
              for r in routes:
                  rinfo[r['id']] = r
                  doc = {'v': 2, 'id': r['id'], 'mode': r['mode'], 'ref': r['ref'], 'name': r['name'], 'col': r['col'], 'op': r['op'],
                         's': [[sid, e5(stops[sid]['lat']), e5(stops[sid]['lon']), stops[sid]['name'], stops[sid]['place'],
                                len(stops[sid]['routes']), stops[sid]['modes']] for sid in r['stops']],
                         'g': r['g'], 'km': r['km']}
                  write_json(os.path.join(out, 'r', f"{r['rid'] % 100:02d}", r['id'] + '.json'), doc)
              # (the other direction of a route, and any route merged into another: which one it is now,
              # so a game that has it carries on with that. One file for them all: a Pages site with too
              # many files takes too long to go live)
              write_json(os.path.join(out, 'aliases.json'), {'v': 1, 'a': aliases})
              log('wrote routes', len(routes), 'and', len(aliases), 'other directions pointing at them')

              # places
              pdoc = []
              for p in places:
                  b = p['geom'].bounds
                  pdoc.append([p['id'], p['name'], p['level'], p['pop'], p['stops'], p['routes'],
                               [e5(b[1]), e5(b[0]), e5(b[3]), e5(b[2])], enc_rings(p['geom'], 0.0003), enc_rings(p['geom'], 0.003)])
              write_json(os.path.join(out, 'places.json'), {'v': 1, 'p': pdoc})

              # towns you can start in (with at least 3 routes within 2 km)
              grid = defaultdict(list)
              for s in stops.values():
                  grid[(int(s['lon'] / 0.02), int(s['lat'] / 0.02))].append(s)
              tdoc = []
              for name, lon, lat, kind, pop in R.towns:
                  rs = set()
                  gx, gy = int(lon / 0.02), int(lat / 0.02)
                  for dx in (-1, 0, 1):
                      for dy in (-1, 0, 1):
                          for s in grid.get((gx + dx, gy + dy), ()):
                              if hav_km((lon, lat), (s['lon'], s['lat'])) <= 2.0:
                                  rs.update(s['routes'])
                  if len(rs) >= 3:
                      near = min(grid.get((gx, gy), []) or [None], key=lambda s: hav_km((lon, lat), (s['lon'], s['lat'])) if s else 0)
                      tdoc.append([name, e5(lat), e5(lon), pop, {'city': 3, 'town': 2, 'village': 1}[kind], len(rs),
                                   (near or {}).get('place', '')])
              tdoc.sort(key=lambda t: (-t[4], -t[3], t[0]))
              write_json(os.path.join(out, 'towns.json'), {'v': 1, 't': tdoc})
              log('towns', len(tdoc))

              # detail tiles: every tile with stops, and the ones around them
              by_tile = defaultdict(list)
              for s in stops.values():
                  by_tile[tile_of(s['lon'], s['lat'], TZ)].append(s)
              want = set()
              for (x, y) in by_tile:
                  for dx in (-1, 0, 1):
                      for dy in (-1, 0, 1):
                          want.add((x + dx, y + dy))
              lon_min = min(s['lon'] for s in stops.values()) - 0.1
              lon_max = max(s['lon'] for s in stops.values()) + 0.1
              lat_min = min(s['lat'] for s in stops.values()) - 0.1
              lat_max = max(s['lat'] for s in stops.values()) + 0.1
              sea = load_sea(a.sea, (lon_min, lat_min, lon_max, lat_max)) if a.sea else []
              edge = None
              if a.poly and os.path.exists(a.poly):
                  try:
                      edge = load_poly(a.poly)
                      log('extract edge', a.poly, 'area', round(edge.area, 3) if edge is not None else None)
                  except Exception as e:
                      log('  could not read', a.poly, e)
              coast = Sea(R.coast, edge) if not sea else Sea([])
              water = R.areas['w'] + sea
              bw, bg, bs = bucket(water, TZ), bucket(R.areas['g'], TZ), bucket(R.areas['s'], TZ)
              bl = bucket(R.lines, TZ, with_cls=True)
              sights_by_tile = defaultdict(list)
              seen_s = set()
              for nm, lon, lat, kind in R.sights:
                  key = (nm, round(lon, 3), round(lat, 3))
                  if key in seen_s:
                      continue
                  seen_s.add(key)
                  t = tile_of(lon, lat, TZ)
                  if t in want:
                      sights_by_tile[t].append((nm[:50], lon, lat, kind))
              apts, seen_a = [], set()
              for iata, nm, lon, lat in R.airports:
                  if iata in seen_a or not re.fullmatch(r'[A-Z]{3}', iata or ''):
                      continue
                  seen_a.add(iata)
                  apts.append([iata, nm[:60], e5(lat), e5(lon)])
              write_json(os.path.join(out, 'airports.json'), {'v': 1, 'a': apts})
              log('airports', len(apts), 'sights', len(seen_s))
              tiles = []
              nbytes = 0
              for (x, y) in sorted(want):
                  doc = {'v': 2, 'x': x, 'y': y}
                  ss = by_tile.get((x, y), [])
                  if ss:
                      rids = []
                      ridx = {}
                      for s in ss:
                          for rid in s['routes']:
                              if rid not in ridx:
                                  ridx[rid] = len(rids)
                                  rids.append(rid)
                      doc['r'] = [[rid, rinfo[rid]['mode'], rinfo[rid]['ref'], rinfo[rid]['name'], rinfo[rid]['col'],
                                   len(rinfo[rid]['stops']), round(rinfo[rid]['total'], 1)] for rid in rids]
                      n = 1 << TZ
                      doc['s'] = []
                      pidx, plist = {}, []
                      for s in sorted(ss, key=lambda s: s['id']):
                          lx = int(round((mercx(s['lon']) * n - x) * EXT))
                          ly = int(round((mercy(s['lat']) * n - y) * EXT))
                          if s['place'] not in pidx:
                              pidx[s['place']] = len(plist)
                              plist.append(s['place'])
                          doc['s'].append([s['id'], lx, ly, s['name'], s['modes'], pidx[s['place']], [ridx[r] for r in s['routes']]])
                      doc['p'] = plist
                  try:
                      # (water and parks with their real shapes: enough triangles that lakes and rivers
                      # don't come out as shards)
                      doc['w'] = budget_tris(layer_shape(bw.get((x, y), []) + coast.in_box(box(*tile_lonlat_box(x, y, TZ))), x, y, TZ, 3.0, 300), 3.0, 300, 1600)
                      doc['g'] = budget_tris(layer_shape(bg.get((x, y)), x, y, TZ, 5.0, 3000, merge=8.0), 5.0, 3000, 1400)
                      doc['b'] = budget_tris(layer_shape(bs.get((x, y)), x, y, TZ, 5.0, 3000), 5.0, 3000, 300)
                      doc['l'] = chunked_lines(bl.get((x, y), []), x, y, TZ, 5.0, {1, 2, 3, 8})
                  except Exception as e:
                      log('  map for tile', x, y, 'failed:', e)
                      doc['w'], doc['g'], doc['b'], doc['l'] = [], [], [], []
                  ks = sights_by_tile.get((x, y), [])
                  if ks:
                      n = 1 << TZ
                      doc['k'] = [[nm, int(round((mercx(lon) * n - x) * EXT)), int(round((mercy(lat) * n - y) * EXT)), kind] for nm, lon, lat, kind in ks]
                  # (the smaller roads and streets: last in the file, so the server can hand them on
                  # separately, only to players zoomed in far enough to see them)
                  try:
                      st = chunked_lines(bl.get((x, y), []), x, y, TZ, 5.0, {4}) + chunked_lines(bl.get((x, y), []), x, y, TZ, 6.0, {5})
                  except Exception as e:
                      log('  streets for tile', x, y, 'failed:', e)
                      st = []
                  if st:
                      doc['st'] = st
                  if not (ss or ks or doc['w'] or doc['g'] or doc['l'] or st):
                      continue
                  p = os.path.join(out, 't', str(x), f'{y}.json')
                  write_json(p, doc)
                  nbytes += os.path.getsize(p)
                  tiles.append([x, y, 1 if ss else 0])
              log('detail tiles', len(tiles), 'MB', round(nbytes / 1e6, 1))

              # overview tiles
              big_w = [g for g in water if (lambda b: (b[2] - b[0]) * (b[3] - b[1]))(g.bounds) > 2e-5] + sea
              big_g = [g for g in R.areas['g'] if (lambda b: (b[2] - b[0]) * (b[3] - b[1]))(g.bounds) > 2e-4]
              big_l = [it for it in R.lines if it[0] == 1]
              ow, og, ol = bucket(big_w, OZ), bucket(big_g, OZ), bucket(big_l, OZ, with_cls=True)
              otiles = []
              ox0, oy1 = tile_of(lon_min, lat_min, OZ)
              ox1, oy0 = tile_of(lon_max, lat_max, OZ)
              oall = {(x, y) for x in range(ox0, ox1 + 1) for y in range(oy0, oy1 + 1)}
              for (x, y) in sorted(oall | set(tile_of(s['lon'], s['lat'], OZ) for s in stops.values())):
                  try:
                      doc = {'v': 2, 'x': x, 'y': y, 'z': OZ,
                             'w': budget_tris(layer_shape(ow.get((x, y), []) + coast.in_box(box(*tile_lonlat_box(x, y, OZ))), x, y, OZ, 2.0, 40), 2.5, 60, 700),
                             'g': budget_tris(layer_shape(og.get((x, y)), x, y, OZ, 3.0, 400, merge=3.0), 4.0, 600, 500),
                             'l': chunked_lines(ol.get((x, y), []), x, y, OZ, 3.0, {1})}
                  except Exception as e:
                      log('  overview tile', x, y, 'failed:', e)
                      continue
                  if doc['w'] or doc['g'] or doc['l']:
                      write_json(os.path.join(out, 'o', str(x), f'{y}.json'), doc)
                      otiles.append([x, y])
              log('overview tiles', len(otiles))

              bb = [e5(lat_min + 0.1), e5(lon_min + 0.1), e5(lat_max - 0.1), e5(lon_max - 0.1)]
              write_json(os.path.join(out, 'meta.json'), {
                  'v': 2, 'region': a.region, 'name': a.name or a.region, 'built': time.strftime('%Y-%m-%d'), 'bbox': bb,
                  'tz': TZ, 'oz': OZ, 'ext': EXT, 't': tiles, 'o': otiles,
                  'counts': {'routes': len(routes), 'stops': len(stops), 'places': len(places), 'towns': len(tdoc),
                             'modes': dict(Counter(r['mode'] for r in routes))}})
              log('done', a.region)


          if __name__ == '__main__':
              main()
          PYEOF
          python3 world_build.py --pbf region.osm.pbf --poly region.poly --region "$REGION" --name "$REGION_NAME" --out out
      - name: Save them
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd "out/$REGION"
          git init -q
          git checkout -q --orphan "data-$REGION"
          git add -A
          git -c user.name="world builder" -c user.email="actions@users.noreply.github.com" commit -q -m "$REGION_NAME $(date -u +%F)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/data-$REGION"

  publish:
    needs: [plan, region]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Collect every region
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir -p site tmp
          for b in $(git ls-remote --heads "https://github.com/$REPO" 'data-*' | sed 's#.*refs/heads/##'); do
            r="${b#data-}"
            git clone -q --depth 1 --branch "$b" "https://github.com/$REPO.git" "tmp/$r"
            rm -rf "tmp/$r/.git"
            mv "tmp/$r" "site/$r"
          done
          du -sh site
      - name: Write the index
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, shutil, time
          repo = os.environ['REPO']
          regions, towns = [], []
          sizes = {}
          # (data built by an older builder has a file for each route that's now another one's
          # other direction: they go in one file, as a Pages site with too many files takes too
          # long to go live)
          for reg_dir in sorted(glob.glob('site/*/')):
              al = {}
              for p in glob.glob(reg_dir + 'r/*/*.json'):
                  if os.path.getsize(p) < 300:
                      try:
                          d = json.load(open(p))
                      except Exception:
                          continue
                      if isinstance(d, dict) and isinstance(d.get('alias'), str):
                          al[d.get('id') or os.path.basename(p)[:-5]] = d['alias']
                          os.remove(p)
              if al:
                  ap = reg_dir + 'aliases.json'
                  if os.path.exists(ap):
                      al.update(json.load(open(ap)).get('a', {}))
                  json.dump({'v': 1, 'a': al}, open(ap, 'w'), separators=(',', ':'))
                  print(reg_dir, len(al), 'routes that are now others put in one file')
          for meta in sorted(glob.glob('site/*/meta.json')):
              r = os.path.basename(os.path.dirname(meta))
              m = json.load(open(meta))
              if m.get('empty'):
                  continue
              total = 0
              for root, dirs, files in os.walk('site/' + r):
                  total += sum(os.path.getsize(os.path.join(root, f)) for f in files)
              sizes[r] = total
              regions.append({'id': r, 'name': m.get('name', r), 'bbox': m['bbox'], 'built': m.get('built'),
                              'counts': m.get('counts', {}), 'path': r + '/'})
          # (a Pages site can hold 1 GB: the biggest regions past that load straight from their branch)
          budget = 900e6
          for reg in sorted(regions, key=lambda x: sizes[x['id']]):
              if sizes[reg['id']] <= budget:
                  budget -= sizes[reg['id']]
              else:
                  reg['base'] = 'https://raw.githubusercontent.com/' + repo + '/data-' + reg['id'] + '/'
          for i, reg in enumerate(regions):
              for t in json.load(open('site/' + reg['id'] + '/towns.json'))['t']:
                  towns.append(t[:6] + [i, t[6]])
              if reg.get('base'):
                  keep = {'meta.json', 'towns.json', 'places.json'}
                  for f in os.listdir('site/' + reg['id']):
                      if f not in keep:
                          p = 'site/' + reg['id'] + '/' + f
                          shutil.rmtree(p) if os.path.isdir(p) else os.remove(p)
          towns.sort(key=lambda t: t[0].lower())
          json.dump({'v': 1, 'built': time.strftime('%Y-%m-%d'), 'attribution': 'Map data (c) OpenStreetMap contributors',
                     'regions': regions}, open('site/index.json', 'w'), separators=(',', ':'))
          json.dump({'v': 1, 't': towns}, open('site/towns.json', 'w'), ensure_ascii=False, separators=(',', ':'))
          print(len(regions), 'regions,', len(towns), 'towns')
          EOF
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # (Pages is sometimes slow to take a big site: once more if it timed out)
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
